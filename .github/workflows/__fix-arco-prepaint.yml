name: One-shot ARCO prepaint fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/__fix-arco-prepaint.yml

permissions:
  contents: write

jobs:
  patch-arco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch arco.html before first paint
        shell: python
        run: |
          from pathlib import Path

          path = Path("arco.html")
          content = path.read_text(encoding="utf-8")

          head_old = '<meta name="theme-color" content="#FFFFFF">\n'
          head_new = '''<meta name="theme-color" content="#FFFFFF">

<style>html.booting-scroll{scroll-behavior:auto!important}</style>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  root.classList.add("booting-scroll");
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  root.scrollTop = 0;
  window.scrollTo(0, 0);
})();
</script>
'''

          reset_old = '''  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  function resetScroll(){
    const root = document.documentElement;
    const previous = root.style.scrollBehavior;
    root.style.scrollBehavior = "auto";
    window.scrollTo({top:0, left:0, behavior:"auto"});
    requestAnimationFrame(() => {
      window.scrollTo({top:0, left:0, behavior:"auto"});
      root.style.scrollBehavior = previous;
    });
  }
'''

          reset_new = '''  function resetScroll(){
    const root = document.documentElement;
    const snap = () => {
      root.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
      window.scrollTo(0, 0);
    };

    root.classList.add("booting-scroll");
    snap();
    requestAnimationFrame(() => {
      snap();
      requestAnimationFrame(() => {
        snap();
        root.classList.remove("booting-scroll");
      });
    });
  }
'''

          route_old = '''  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));
  show(location.hash.slice(1) || "home", {push:false});
'''

          route_new = '''  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));
  addEventListener("pageshow", () => {
    resetScroll();
    setTimeout(resetScroll, 0);
  });
  addEventListener("load", () => {
    resetScroll();
    setTimeout(resetScroll, 0);
  }, {once:true});
  show(location.hash.slice(1) || "home", {push:false});
'''

          replacements = [
              (head_old, head_new),
              (reset_old, reset_new),
              (route_old, route_new),
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:120]!r}")
              content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8", newline="\n")

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix ARCO scroll restoration before first paint"
          git push origin HEAD:main

