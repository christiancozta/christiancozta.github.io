name: One-shot ARCO loading fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/__fix-arco-scroll.yml

permissions:
  contents: write

jobs:
  patch-arco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch arco.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("arco.html")
          content = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">',
                  'family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">',
              ),
              (
                  '  "use strict";\n  const VIEWS = ["home","echo","atrio"];',
                  '  "use strict";\n\n  if ("scrollRestoration" in history) {\n    history.scrollRestoration = "manual";\n  }\n\n  function resetScroll(){\n    const root = document.documentElement;\n    const previous = root.style.scrollBehavior;\n    root.style.scrollBehavior = "auto";\n    window.scrollTo({top:0, left:0, behavior:"auto"});\n    requestAnimationFrame(() => {\n      window.scrollTo({top:0, left:0, behavior:"auto"});\n      root.style.scrollBehavior = previous;\n    });\n  }\n\n  const VIEWS = ["home","echo","atrio"];',
              ),
              (
                  '    window.scrollTo(0,0);\n    stage.focus({preventScroll:true});',
                  '    resetScroll();\n    stage.focus({preventScroll:true});',
              ),
              (
                  '  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));\n  if (location.hash) show(location.hash.slice(1), {push:false});',
                  '  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));\n  show(location.hash.slice(1) || "home", {push:false});',
              ),
              (
                  "    layout();\n    requestAnimationFrame(layout);\n    addEventListener('resize', layout, {passive:true});",
                  "    layout();\n    requestAnimationFrame(layout);\n    if (document.fonts?.ready) {\n      document.fonts.ready.then(() => {\n        layout();\n        requestAnimationFrame(layout);\n      });\n    }\n    addEventListener('resize', layout, {passive:true});",
              ),
          ]

          for old, new in replacements:
              if old == new:
                  if old not in content:
                      raise SystemExit(f"Expected font URL fragment not found: {old!r}")
                  continue
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old!r}")
              content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8", newline="\n")

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix ARCO initial loading and layout stability"
          git push origin HEAD:main
