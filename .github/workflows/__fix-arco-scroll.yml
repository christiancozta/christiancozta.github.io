name: Apply ARCO prepaint scroll correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/__fix-arco-scroll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch arco.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('arco.html')
          s = p.read_text(encoding='utf-8')

          a = '<meta name="theme-color" content="#FFFFFF">\n'
          b = '''<meta name="theme-color" content="#FFFFFF">

<style>html.booting-scroll{scroll-behavior:auto!important}</style>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  root.classList.add("booting-scroll");
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  root.scrollTop = 0;
  window.scrollTo(0, 0);
})();
</script>
'''

          c = '''  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  function resetScroll(){
    const root = document.documentElement;
    const previous = root.style.scrollBehavior;
    root.style.scrollBehavior = "auto";
    window.scrollTo({top:0, left:0, behavior:"auto"});
    requestAnimationFrame(() => {
      window.scrollTo({top:0, left:0, behavior:"auto"});
      root.style.scrollBehavior = previous;
    });
  }
'''
          d = '''  function resetScroll(){
    const root = document.documentElement;
    const snap = () => {
      root.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
      window.scrollTo(0, 0);
    };
    root.classList.add("booting-scroll");
    snap();
    requestAnimationFrame(() => {
      snap();
      requestAnimationFrame(() => {
        snap();
        root.classList.remove("booting-scroll");
      });
    });
  }
'''

          e = '''  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));
  show(location.hash.slice(1) || "home", {push:false});
'''
          f = '''  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));
  addEventListener("pageshow", () => {
    resetScroll();
    setTimeout(resetScroll, 0);
  });
  addEventListener("load", () => {
    resetScroll();
    setTimeout(resetScroll, 0);
  }, {once:true});
  show(location.hash.slice(1) || "home", {push:false});
'''

          for old, new in ((a,b),(c,d),(e,f)):
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Expected 1 match, found {n}')
              s = s.replace(old,new,1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git commit -m "Fix ARCO restoration before first paint"
          git push origin HEAD:main
