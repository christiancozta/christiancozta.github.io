name: Apply ARCO prepaint scroll correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/__fix-arco-scroll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch arco.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('arco.html')
          s = p.read_text(encoding='utf-8')

          if 'html.booting-scroll' not in s:
              marker = '<meta name="theme-color" content="#FFFFFF">'
              insert = marker + '''

<style>html.booting-scroll{scroll-behavior:auto!important}</style>
<script>
(() => {
  "use strict";
  const root = document.documentElement;
  root.classList.add("booting-scroll");
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  root.scrollTop = 0;
  window.scrollTo(0, 0);
})();
</script>'''
              if marker not in s:
                  raise SystemExit('theme-color marker not found')
              s = s.replace(marker, insert, 1)

          reset_pattern = re.compile(
              r'\n  if \("scrollRestoration" in history\) \{.*?\n  \}\n\n  function resetScroll\(\)\{.*?\n  \}\n',
              re.S,
          )
          reset_replacement = '''

  function resetScroll(){
    const root = document.documentElement;
    const snap = () => {
      root.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
      window.scrollTo(0, 0);
    };
    root.classList.add("booting-scroll");
    snap();
    requestAnimationFrame(() => {
      snap();
      requestAnimationFrame(() => {
        snap();
        root.classList.remove("booting-scroll");
      });
    });
  }
'''
          if 'const previous = root.style.scrollBehavior' in s:
              s, n = reset_pattern.subn(reset_replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'reset block replacements: {n}')

          route = '  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));\n'
          listeners = '''  addEventListener("popstate", () => show(location.hash.slice(1) || "home", {push:false}));
  addEventListener("pageshow", () => {
    resetScroll();
    setTimeout(resetScroll, 0);
  });
  addEventListener("load", () => {
    resetScroll();
    setTimeout(resetScroll, 0);
  }, {once:true});
'''
          if 'addEventListener("pageshow"' not in s:
              if route not in s:
                  raise SystemExit('route marker not found')
              s = s.replace(route, listeners, 1)

          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Fix ARCO restoration before first paint"
          git push origin HEAD:main

# retry 2
