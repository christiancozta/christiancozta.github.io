name: Apply DATA origin foundation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_apply-data-origin.yml

permissions:
  contents: write

jobs:
  patch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch DATA and publish evidence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data.html')
          text = path.read_text(encoding='utf-8')

          old_marker = '''    <p style="margin:clamp(56px,8vh,104px) 0 0;font:500 10px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.2em;color:#8A8A86">ORIGEM · TRÊS BASES QUE NÃO SOMAM</p>'''
          next_marker = '\n  <div style="background:#0057FF;color:#FCFCFC;'

          new_block = '''    <p style="margin:clamp(56px,8vh,104px) 0 0;font:500 10px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.2em;color:#8A8A86">ORIGEM · QUATRO BASES QUE NÃO SOMAM</p>
            <p style="margin:14px 0 0;max-width:72ch;font-size:13.5px;line-height:1.6;color:#6E6E6A">A operação de execuções fiscais antecede os sistemas e entra aqui como fundação. ECHO, ATRIO e CORPUS pertencem a universos e períodos próprios; os valores documentam uma cadeia de trabalho, não uma soma acumulada.</p>

            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:0;margin-top:22px;border-top:1px solid #181818">
              <div style="padding:26px 28px 30px 0">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px">
                  <p style="margin:0;font-family:'Anybody',system-ui,sans-serif;font-weight:900;font-stretch:125%;font-size:1.3rem;letter-spacing:-.01em;color:#0057FF">FUNDAÇÃO</p>
                  <p style="margin:0;font:500 9.5px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.16em;color:#8A8A86">EXECUÇÕES FISCAIS</p>
                </div>
                <div style="margin-top:24px;padding-bottom:14px;border-bottom:1px solid #E2E2E0">
                  <p tabindex="0" role="note" data-datum data-fonte="exec_fiscais_res574_derivada.csv" data-calculo="264 + 256 = 520; 520 / 600 = 86,67%" data-fundamento="264 processos enquadrados na Resolução + 256 encaminhados à extinção" data-recorte="Universo tratado: 600 processos" data-limite="Saneamento por extinção não equivale, por si só, à baixa processual definitiva." style="margin:0;font:700 clamp(3rem,5.3vw,4.5rem)/.84 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.06em;font-variant-numeric:tabular-nums;color:#0057FF">520</p>
                  <p style="margin:12px 0 0;font-size:13px;line-height:1.45;color:#3D3D3A">saneamentos por extinção</p>
                </div>
                <div style="display:grid;gap:12px;margin-top:14px">
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="exec_fiscais_res574_derivada.csv" data-fundamento="universo consolidado da operação" data-recorte="Operação de execuções fiscais" style="font:600 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#0057FF">600</span><span style="font-size:13px;text-align:right;color:#3D3D3A">processos tratados</span></div>
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="exec_fiscais_res574_derivada.csv" data-calculo="520 ÷ 600" data-fundamento="520 saneamentos por extinção em 600 processos" data-recorte="mesmo universo" style="font:600 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:#0057FF">86,7%</span><span style="font-size:13px;text-align:right;color:#3D3D3A">do universo</span></div>
                </div>
                <p style="margin:16px 0 0;font-size:12.5px;line-height:1.55;color:#6E6E6A"><span style="font-family:'Azeret Mono',ui-monospace,monospace;font-weight:600;color:#181818">264</span> enquadrados na Resolução + <span style="font-family:'Azeret Mono',ui-monospace,monospace;font-weight:600;color:#181818">256</span> encaminhados à extinção.</p>
                <a href="assets/data/lastro/exec_fiscais_res574_derivada.csv" style="display:inline-block;margin-top:22px;font:600 10px/1.4 'Azeret Mono',ui-monospace,monospace;letter-spacing:.14em;border-bottom:1px solid #0057FF;padding-bottom:3px">DERIVADO PÚBLICO ↗</a>
              </div>

              <div style="padding:26px 28px 30px;border-left:1px solid #E2E2E0">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px">
                  <p style="margin:0"><span style="display:inline-block;background:#FFB627;color:#181818;padding:.12em .34em .14em;font-family:'Anybody',system-ui,sans-serif;font-weight:900;font-stretch:125%;font-size:1.3rem;line-height:1;letter-spacing:-.01em">ECHO</span></p>
                  <p style="margin:0;font:500 9.5px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.16em;color:#8A8A86">4ª TURMA</p>
                </div>
                <div style="display:grid;gap:13px;margin-top:24px">
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="acervo_publico.xlsx" data-fundamento="1.192 registros públicos anonimizados" data-recorte="Operação, 4ª Turma" style="display:inline-block;background:#FFB627;color:#181818;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums">1.192</span><span style="font-size:13px;text-align:right;color:#3D3D3A">processos triados</span></div>
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="mapa_tematico_publico.pdf" data-calculo="1 − 10/102" data-fundamento="102 assuntos de origem, 92 categorias suprimidas" data-recorte="Taxonomia operacional" style="display:inline-block;background:#FFB627;color:#181818;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums">90,2%</span><span style="font-size:13px;text-align:right;color:#3D3D3A">redução categorial</span></div>
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="precedentes_publico.xlsx" data-fundamento="483 com tese firmada" data-recorte="Painel temático" style="display:inline-block;background:#FFB627;color:#181818;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums">631</span><span style="font-size:13px;text-align:right;color:#3D3D3A">temas de precedentes</span></div>
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="ementario_publico.xlsx" data-fundamento="contagem absoluta" data-recorte="Acervo integral" style="display:inline-block;background:#FFB627;color:#181818;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums">2.758</span><span style="font-size:13px;text-align:right;color:#3D3D3A">ementas catalogadas</span></div>
                </div>
                <a href="assets/data/lastro/README.md" style="display:inline-block;margin-top:22px;font:600 10px/1.4 'Azeret Mono',ui-monospace,monospace;letter-spacing:.14em;border-bottom:1px solid #FFB627;padding-bottom:3px">LASTRO PÚBLICO ↗</a>
              </div>

              <div style="padding:26px 28px 30px;border-left:1px solid #E2E2E0">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px">
                  <p style="margin:0"><span style="display:inline-block;background:#A63A23;color:#FCFCFC;padding:.12em .34em .14em;font-family:'Anybody',system-ui,sans-serif;font-weight:900;font-stretch:125%;font-size:1.3rem;line-height:1;letter-spacing:-.01em">ATRIO</span></p>
                  <p style="margin:0;font:500 9.5px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.16em;color:#8A8A86">2ª TURMA</p>
                </div>
                <div style="display:grid;gap:13px;margin-top:24px">
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="operacao_atrio_publica.md" data-fundamento="33 operações HTTP declaradas" data-recorte="Rotas de api.py" style="display:inline-block;background:#A63A23;color:#FCFCFC;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums">31</span><span style="font-size:13px;text-align:right;color:#3D3D3A">rotas /v1</span></div>
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span tabindex="0" role="note" data-datum data-fonte="operacao_atrio_publica.md" data-fundamento="contagem absoluta" data-recorte="Suíte local, 26.08.2026" style="display:inline-block;background:#A63A23;color:#FCFCFC;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em;font-variant-numeric:tabular-nums">188</span><span style="font-size:13px;text-align:right;color:#3D3D3A">testes automatizados</span></div>
                  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:11px;border-bottom:1px solid #E2E2E0"><span style="display:inline-block;background:#A63A23;color:#FCFCFC;padding:.10em .24em .13em;font:700 1.7rem/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.04em">LOCAL</span><span style="font-size:13px;text-align:right;color:#3D3D3A">execução</span></div>
                </div>
                <a href="https://github.com/christiancozta/atrio-api" target="_blank" rel="noopener" style="display:inline-block;margin-top:22px;font:600 10px/1.4 'Azeret Mono',ui-monospace,monospace;letter-spacing:.14em;border-bottom:1px solid #A63A23;padding-bottom:3px">REPOSITÓRIO ATRIO-API ↗</a>
              </div>

              <div style="padding:26px 0 30px 28px;border-left:1px solid #E2E2E0">
                <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px">
                  <p style="margin:0"><span style="display:inline-block;background:#A63A23;color:#FCFCFC;padding:.12em .34em .14em;font-family:'Anybody',system-ui,sans-serif;font-weight:900;font-stretch:125%;font-size:1.3rem;line-height:1;letter-spacing:-.01em">CORPUS</span></p>
                  <p style="margin:0;font:500 9.5px/1 'Azeret Mono',ui-monospace,monospace;letter-spacing:.16em;color:#8A8A86">BASE GOVERNADA</p>
                </div>
                <p tabindex="0" role="note" data-datum data-fonte="diagnostico_corpus_publico.md" data-fundamento="contagem após identificação e deduplicação" data-recorte="Recorte operacional publicado" style="margin:24px 0 0"><span style="display:inline-block;background:#A63A23;color:#FCFCFC;padding:.10em .22em .13em;font:700 clamp(2.4rem,4.6vw,3.6rem)/.85 'Azeret Mono',ui-monospace,monospace;letter-spacing:-.05em;font-variant-numeric:tabular-nums">115.114</span></p>
                <p style="margin:14px 0 0;font-size:13px;line-height:1.55;color:#3D3D3A">Registros processuais únicos, após identificação e deduplicação. Mede escala de base, não qualidade decisória.</p>
              </div>
            </div>
          </div>'''

          if 'ORIGEM · QUATRO BASES QUE NÃO SOMAM' not in text:
              start = text.index(old_marker)
              end = text.index(next_marker, start)
              text = text[:start] + new_block + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

          mkdir -p assets/data/lastro
          cat > assets/data/lastro/exec_fiscais_res574_derivada.csv <<'CSV'
          metrica;valor;unidade;calculo;interpretacao;limite_metodologico
          universo_tratado;600;processos;contagem consolidada;universo da operação;não representa, isoladamente, resultado processual
          enquadrados_resolucao;264;processos;contagem;saneamento por extinção;classificação para saneamento não equivale, por si só, à baixa definitiva
          encaminhados_extincao;256;processos;contagem;saneamento por extinção;encaminhamento não equivale, por si só, à baixa definitiva
          saneamento_extincao_total;520;processos;264 + 256;total classificado para saneamento por extinção;não equivale, por si só, à baixa processual definitiva
          taxa_saneamento_extincao;86,7;percentual;520 / 600 × 100;parcela do universo com saneamento por extinção;percentual restrito ao universo tratado
          demais_casos;80;processos;600 - 520;fora do resultado agregado de saneamento por extinção;categoria residual derivada aritmeticamente
          CSV

          (cd assets/data/lastro && sha256sum exec_fiscais_res574_derivada.csv > exec_fiscais_res574_derivada.sha256)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-data-origin.yml
          git add data.html assets/data/lastro/exec_fiscais_res574_derivada.csv assets/data/lastro/exec_fiscais_res574_derivada.sha256
          git commit -m "feat(data): adiciona fundação de execuções fiscais e lastro público"
          git push origin HEAD:main
