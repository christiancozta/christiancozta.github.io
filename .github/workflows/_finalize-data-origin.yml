name: Finalize DATA origin

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_finalize-data-origin.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize DATA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('data.html')
          text = p.read_text(encoding='utf-8')

          css_anchor = '''#topo [data-saidas] a:focus-visible{outline:2px solid #0057FF!important;outline-offset:3px!important}\n'''
          css_patch = '''#topo [data-saidas]{\n  left:clamp(20px,5vw,96px)!important;\n  right:auto!important;\n  justify-content:flex-start!important;\n}\n'''
          if css_patch not in text:
              text = text.replace(css_anchor, css_anchor + css_patch, 1)

          public_old = '''A verificação pública usa jurimetria_derivada.csv e o hash SHA-256 da fonte, além dos derivados mínimos de ECHO e ATRIO em assets/data/lastro. O derivado agregado permite recalcular as figuras publicadas sem expor linhas processuais ou dados de terceiros.'''
          public_new = '''A verificação pública usa jurimetria_derivada.csv e o hash SHA-256 da fonte, além dos derivados mínimos de ECHO, ATRIO e da operação de execuções fiscais (Res. 574) em assets/data/lastro. Os derivados agregados permitem recalcular as figuras publicadas sem expor linhas processuais ou dados de terceiros.'''
          text = text.replace(public_old, public_new, 1)

          indice_anchor = '''const INDICE = [\n'''
          novas = '''  { valor: '520', ord: 520, oque: 'Saneamentos por extinção', tipo: 'Direta', fonte: 'exec_fiscais_res574_derivada.csv', unidade: 'FUNDAÇÃO' },\n  { valor: '600', ord: 600, oque: 'Processos tratados', tipo: 'Direta', fonte: 'exec_fiscais_res574_derivada.csv', unidade: 'FUNDAÇÃO' },\n  { valor: '86,7%', ord: 86.7, oque: 'Parcela do universo com saneamento por extinção', tipo: 'Derivada', fonte: '520 ÷ 600', unidade: 'FUNDAÇÃO' },\n'''
          if "oque: 'Saneamentos por extinção'" not in text:
              text = text.replace(indice_anchor, indice_anchor + novas, 1)

          p.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_finalize-data-origin.yml
          git add data.html
          git commit -m "fix(data): alinha ações da hero à esquerda e indexa fundação"
          git push origin HEAD:main
