name: ARCO apply phase 1

on:
  push:
    branches:
      - audit/arco-hero-consolidation-20260906
    paths:
      - '.arco-audit/apply-phase1.flag'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/arco-hero-consolidation-20260906
          fetch-depth: 0

      - name: Apply deterministic phase 1 transformation
        run: |
          python .arco-audit/refactor_phase1.py
          python .arco-audit/refactor_phase1_post.py
          python .arco-audit/refactor_phase1_semantics.py

      - name: Syntax and whitespace checks
        run: |
          node --check assets/arco/js/arco-core.js
          node --check assets/arco/js/arco.js
          git diff --check

      - name: Commit desktop consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/arco/js/arco-core.js assets/arco/js/arco.js
          git commit -m 'refactor(arco): consolidate desktop hero controller'
          git push origin HEAD:audit/arco-hero-consolidation-20260906
