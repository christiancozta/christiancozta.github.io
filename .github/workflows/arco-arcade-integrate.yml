name: Integrar narrativa da arcada

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arco-arcade-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar Fundação e Regência integradas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('arco.html')
          html = html_path.read_text(encoding='utf-8')

          old_foundation = '''O primeiro movimento ocorreu na Vara de Execuções Fiscais, diante de um acervo de alto
              volume e forte repetição estrutural. A experiência envolveu triagem, organização de carga,
              saneamento de backlog e integração digital de <span tabindex="0" role="note" data-datum data-regime="lastro" data-source="Decreto Judiciário Conjunto nº 508/2023 | TJPR" data-numerator="36.000 processos previstos no Anexo" data-denominator="4 fases de 3 meses | 7 grupos de comarcas" data-period="Núcleo de Justiça 4.0 | a partir de 27.07.2023">36 mil</span> execuções fiscais. Ali se
              formou a percepção inicial: antes de acelerar a produção jurídica, era preciso tornar o
              acervo legível.'''
          new_foundation = '''O primeiro movimento ocorreu em gabinete judicial de primeira instância, diante de um acervo de alto
              volume e forte repetição estrutural. A experiência envolveu triagem, organização de carga,
              saneamento de backlog e integração digital de <span tabindex="0" role="note" data-datum data-regime="lastro" data-source="Decreto Judiciário Conjunto nº 508/2023 | TJPR" data-numerator="36.000 processos previstos no Anexo" data-denominator="4 fases de 3 meses | 7 grupos de comarcas" data-period="Núcleo de Justiça 4.0 | a partir de 27.07.2023">36 mil</span> execuções fiscais. Ali se
              formou a percepção inicial: antes de acelerar a produção jurídica, era preciso tornar o
              acervo legível e a atuação mensurável. Daí viria <button class="b-data" type="button" data-view="data">DATA</button>.'''
          if old_foundation not in html:
              raise SystemExit('Trecho original de Fundação não localizado')
          html = html.replace(old_foundation, new_foundation, 1)

          old_regencia = '''            <p class="mov__t">
              O segundo movimento amadureceu na Turma Recursal, com a passagem da gestão de volume
              para a regência do fluxo decisório. O <button class="b-echo" type="button" data-view="echo">ECHO</button>
              nasce desse momento: organização de acervo, segmentação temática, padronização de
              rotinas, controle de prioridades, gestão de equipe e qualidade de minutas. É o ponto em
              que a experiência judicial se converte em método.
            </p>
            <button class="idlink idlink--echo" type="button" data-tale="tale-echo" aria-haspopup="dialog">Quando não havia a quem perguntar</button>'''
          new_regencia = '''            <p class="mov__t">
              O segundo movimento amadureceu em instância recursal, com a passagem da gestão de volume
              para a regência do fluxo decisório. <em><button class="storylink storylink--echo" type="button" data-tale="tale-echo" aria-haspopup="dialog">Como não havia a quem perguntar</button>, o <button class="b-echo" type="button" data-view="echo">ECHO</button> nasce como método de estruturação operacional</em>:
              organização de acervo, segmentação temática, padronização de rotinas, controle de prioridades,
              gestão de equipe e qualidade de minutas. É o ponto em que a experiência judicial se converte
              em método de operação jurídica.
            </p>'''
          if old_regencia not in html:
              raise SystemExit('Trecho original de Regência não localizado')
          html = html.replace(old_regencia, new_regencia, 1)

          html = html.replace('assets/arco/css/arco.css?v=20260910-lexico', 'assets/arco/css/arco.css?v=20260914-arcade-v2', 1)
          html = html.replace('assets/arco/js/arco.js?v=20260910-lexico', 'assets/arco/js/arco.js?v=20260914-arcade-v2', 1)
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('assets/arco/css/arco.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace(
              '.b-echo, .b-atrio, .t-echo, .t-atrio, .n-echo, .n-atrio{',
              '.b-echo, .b-atrio, .b-data, .t-echo, .t-atrio, .n-echo, .n-atrio{',
              1,
          )
          atrio_band = '''.b-atrio, .t-atrio, .n-atrio{
  background:var(--atrio-band); color:var(--atrio-ink);
}'''
          if atrio_band not in css:
              raise SystemExit('Bloco ATRIO não localizado no CSS')
          css = css.replace(atrio_band, atrio_band + '''
.b-data{
  background:#0057FF; color:#FCFCFC;
}''', 1)
          css = css.replace(
              '.b-echo, .b-atrio{ font:inherit; font-weight:600; cursor:pointer; }',
              '.b-echo, .b-atrio, .b-data{ font:inherit; font-weight:600; cursor:pointer; }',
              1,
          )
          atrio_hover = '.b-atrio:hover, .b-atrio:focus-visible{ box-shadow:0 0 0 1px var(--ink); }'
          if atrio_hover not in css:
              raise SystemExit('Hover ATRIO não localizado no CSS')
          css = css.replace(atrio_hover, atrio_hover + '\n.b-data:hover, .b-data:focus-visible{ box-shadow:0 0 0 1px var(--ink); }', 1)

          anchor = '''.idlink--atrio:hover, .idlink--atrio:focus-visible{ color:var(--atrio); }
'''
          if anchor not in css:
              raise SystemExit('Âncora de idlink não localizada no CSS')
          story_css = '''
/* gatilho narrativo integrado: no desktop o território aparece junto ao cursor;
   no mobile o sublinhado permanece como affordance tátil, sem tooltip. */
.storylink{
  display:inline; appearance:none; -webkit-appearance:none;
  margin:0; padding:0; border:0; background:none; color:inherit;
  font:inherit; font-style:inherit; cursor:pointer;
  text-decoration-line:underline; text-decoration-thickness:1px;
  text-underline-offset:.14em; text-decoration-color:currentColor;
  transition:text-decoration-color var(--fast) var(--ease);
}
.storylink:hover,.storylink:focus-visible{ text-decoration-color:transparent; }
'''
          css = css.replace(anchor, anchor + story_css, 1)
          css_path.write_text(css, encoding='utf-8')

          js_path = Path('assets/arco/js/arco.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('const runtimeUrl = new URL("arco-runtime.js?v=20260912-provenance-v1", src);',
                          'const runtimeUrl = new URL("arco-runtime.js?v=20260914-arcade-v2", src);', 1)
          js = js.replace('    installDataOrigin();\n', '', 1)
          start = js.find('  function installDataOrigin(){')
          end = js.find('  function installProvenanceHover(){')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Função temporária installDataOrigin não localizada')
          js = js[:start] + js[end:]
          js = js.replace('    installProvenanceHover();\n    installContactOrbit();',
                          '    installProvenanceHover();\n    installArcadeStoryHover();\n    installContactOrbit();', 1)

          insertion = '''
  function installArcadeStoryHover(){
    const trigger = document.querySelector('.view[data-view="home"] .storylink--echo');
    const mq = matchMedia("(max-width:820px)");
    if (!trigger) return;

    const tag = document.createElement("span");
    tag.className = "arco-provenance-tag arco-provenance-tag--echo";
    tag.textContent = "ECHO";
    tag.setAttribute("aria-hidden", "true");
    document.body.appendChild(tag);

    const move = event => {
      const gapX = 14, gapY = 12, margin = 8;
      const rect = tag.getBoundingClientRect();
      let x = event.clientX + gapX;
      let y = event.clientY + gapY;
      if (x + rect.width + margin > innerWidth) x = event.clientX - rect.width - gapX;
      if (y + rect.height + margin > innerHeight) y = event.clientY - rect.height - gapY;
      tag.style.left = `${Math.max(margin, x)}px`;
      tag.style.top = `${Math.max(margin, y)}px`;
    };
    const hide = () => tag.classList.remove("is-visible");
    const show = event => {
      if (mq.matches || (event.pointerType && event.pointerType !== "mouse")) return;
      tag.classList.add("is-visible");
      move(event);
    };

    trigger.addEventListener("pointerenter", show);
    trigger.addEventListener("pointermove", event => {
      if (!mq.matches && (!event.pointerType || event.pointerType === "mouse")) move(event);
    });
    trigger.addEventListener("pointerleave", hide);
    trigger.addEventListener("click", hide);
    window.addEventListener("scroll", hide, {passive:true, capture:true});
    window.addEventListener("blur", hide);
    mq.addEventListener?.("change", hide);
  }

'''
          marker = '  function installContactOrbit(){'
          if marker not in js:
              raise SystemExit('Ponto de inserção do hover narrativo não localizado')
          js = js.replace(marker, insertion + marker, 1)
          js_path.write_text(js, encoding='utf-8')

          runtime_path = Path('assets/arco/js/arco-runtime.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          old_mobile = 'arco-mobile-viewport.js?v=20260906-viewport-v1'
          if old_mobile not in runtime:
              raise SystemExit('Cache-buster mobile original não localizado')
          runtime = runtime.replace(old_mobile, 'arco-mobile-viewport.js?v=20260914-arcade-v2', 1)
          runtime_path.write_text(runtime, encoding='utf-8')
          PY

      - name: Remover workflow transitório e commitar
        shell: bash
        run: |
          git rm .github/workflows/arco-arcade-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html assets/arco/css/arco.css assets/arco/js/arco.js assets/arco/js/arco-runtime.js
          git commit -m "feat(arco): integra DATA e ECHO à narrativa da arcada"
          git push origin HEAD:main
