name: ARCO b2b fix + browser validation

on:
  push:
    branches: [b2b]
    paths: ['.github/workflows/arco-b2b-fix-validate.yml']

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2b
          fetch-depth: 0

      - name: Apply measured corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('arco.html')
          s=p.read_text(encoding='utf-8')

          copies={
            '5 domínios de atuação organizam 17 mecanismos, traduzidos em ao menos 86 nomenclaturas equivalentes no mercado privado.':'domínios organizam 17 mecanismos, com ao menos 86 nomenclaturas equivalentes no mercado privado.',
            '4 módulos de IA jurídica compõem ATRIO: arquitetura decisória end-to-end, local, com 175 testes e base de 115.114 julgados.':'módulos de IA jurídica compõem ATRIO: arquitetura local end-to-end, com 175 testes e 115.114 julgados.',
            '3 núcleos de trabalho estruturam 10 temáticas derivadas de 102 assuntos; taxonomia aplicada à triagem de 1.792 processos.':'núcleos estruturam 10 temáticas de 102 assuntos; taxonomia aplicada à triagem de 1.792 processos.',
            '2 projetos implementados e documentados — ECHO e ATRIO — derivados de uma operação jurídica de alto volume.':'projetos implementados e documentados — ECHO e ATRIO — derivados de uma operação jurídica de alto volume.'
          }
          for old,new in copies.items():
            if old not in s: raise SystemExit('copy anchor missing: '+old[:50])
            s=s.replace(old,new,1)

          anchor='  .narr__short{ display:none !important; }'
          mobile='''  .narr__short{ display:none !important; }
          .narr__stat[data-step="1"] .narr__short{
            display:block !important;
            grid-column:2 !important; grid-row:1 !important;
          }'''
          if anchor not in s: raise SystemExit('mobile anchor missing')
          s=s.replace(anchor,mobile,1)

          pattern=re.compile(r'''  function layout\(\)\{\s*
            if \(mq\.matches\) return null;\s*
            const zr = zone\.getBoundingClientRect\(\);\s*
            const ar = arc\.getBoundingClientRect\(\);\s*
            const hr = head\.getBoundingClientRect\(\);\s*
            const nr = name\.getBoundingClientRect\(\);\s*
            const axisX = ar\.left - zr\.left \+ ar\.width / 2;\s*
            const springY = ar\.bottom - zr\.top;\s*
            const arcTop = ar\.top - zr\.top;\s*
            narr\.style\.setProperty\('--cross-axis-x', axisX\.toFixed\(2\) \+ 'px'\);\s*''',re.X)
          replacement='''  function layoutBox(el){
            let x = 0, y = 0, node = el;
            while (node && node !== zone){
              x += node.offsetLeft || 0;
              y += node.offsetTop || 0;
              node = node.offsetParent;
            }
            if (node !== zone) return null;
            const width = el.offsetWidth || 0;
            const height = el.offsetHeight || 0;
            return { x, y, width, height, right:x + width, bottom:y + height };
          }

          function layout(){
            if (mq.matches) return null;

            /* Usa coordenadas de layout: o reveal transforma o SVG, mas a
               encruzilhada precisa nascer da spring física e invariável. */
            const ar = layoutBox(arc);
            const hr = layoutBox(head);
            const nr = layoutBox(name);
            if (!ar || !hr || !nr) return null;

            const axisX = ar.x + ar.width / 2;
            const springY = ar.bottom;
            const arcTop = ar.y;
            narr.style.setProperty('--cross-axis-x', axisX.toFixed(2) + 'px');

          '''
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'desktop layout block matches: {n}')

          if '    const safeTop = hr.bottom - zr.top + 20;' not in s: raise SystemExit('safeTop anchor missing')
          s=s.replace('    const safeTop = hr.bottom - zr.top + 20;','    const safeTop = hr.bottom + 20;',1)

          points=re.compile(r'''    const points = stats\.map\(\(stat, i\) => \{\s*
            const numberRect = numbers\[i\]\.getBoundingClientRect\(\);\s*
            return tops\[i\] \+ numberRect\.height / 2;\s*
            \}\);''',re.X)
          s,n=points.subn('''    const points = stats.map((stat, i) => {
              return tops[i] + numbers[i].offsetHeight / 2;
            });''',s,count=1)
          if n!=1: raise SystemExit(f'points block matches: {n}')

          if '    const nameRight = nr.right - zr.left;' not in s: raise SystemExit('nameRight anchor missing')
          s=s.replace('    const nameRight = nr.right - zr.left;','    const nameRight = nr.right;',1)

          p.write_text(s,encoding='utf-8')
          print('Measured corrections applied')
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('arco.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="hero-5to1-b2b-js">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/hero.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/hero.js

      - name: Install browser harness
        run: npm install --no-save playwright-core@1.55.0

      - name: Validate desktop and mobile in Chrome
        run: |
          export CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          node <<'JS'
          const { chromium }=require('playwright-core');
          const assert=require('assert');
          const near=(a,b,t,msg)=>assert(Math.abs(a-b)<=t,`${msg}: ${a} vs ${b}; delta ${Math.abs(a-b)}`);
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
            async function load(w,h){
              const p=await browser.newPage({viewport:{width:w,height:h}}), errors=[];
              p.on('pageerror',e=>errors.push(String(e)));
              await p.goto('http://127.0.0.1:8765/arco.html',{waitUntil:'networkidle'});
              await p.evaluate(()=>document.fonts?.ready);
              await p.mouse.move(150,120);
              await p.waitForTimeout(w<=820?5000:3600);
              assert.deepStrictEqual(errors,[],`page errors ${w}: ${errors}`);
              return p;
            }
            async function desktop(w,h,label){
              const p=await load(w,h);
              const b=await p.evaluate(()=>{const q=s=>document.querySelector(s),r=e=>{const x=e.getBoundingClientRect();return{left:x.left,right:x.right,top:x.top,bottom:x.bottom,width:x.width,height:x.height}};return{arc:r(q('.narr-zone .arc')),axis:r(q('.hero-cross-axis')),link:r(q('.hero-cross-link')),name:r(q('.bio__name')),scrollWidth:document.body.scrollWidth,innerWidth}});
              near(b.axis.left+b.axis.width/2,b.arc.left+b.arc.width/2,1.1,label+' axis center');
              near(b.axis.bottom,b.arc.bottom,1.1,label+' spring endpoint');
              assert(b.link.left>=b.name.right+20,label+' crossbar/name clearance');
              assert(b.scrollWidth<=b.innerWidth+1,label+' overflow');
              const expanded=[];
              for(const step of ['5','4','3','2']){
                await p.click(`.narr__stat[data-step="${step}"] button.narr__n`); await p.waitForTimeout(340);
                const e=await p.evaluate(step=>{const st=document.querySelector(`.narr__stat[data-step="${step}"]`),d=st.querySelector('.narr__detail'),a=document.querySelector('.arc'),dr=d.getBoundingClientRect(),sr=st.getBoundingClientRect(),ar=a.getBoundingClientRect(),lh=parseFloat(getComputedStyle(d).lineHeight);return{step,lines:Math.round(dr.height/lh),gap:ar.top-sr.bottom,open:[...document.querySelectorAll('.narr__stat.is-open')].map(x=>x.dataset.step),text:d.textContent.trim()}},step);
                assert(e.lines<=2,`${label} step ${step}: ${e.lines} lines`);
                assert.deepStrictEqual(e.open,[step],`${label} accordion ${step}`);
                expanded.push(e);
              }
              assert(expanded[0].gap>=5,`${label} expanded 5 arc gap ${expanded[0].gap}`);
              await p.screenshot({path:`/tmp/${label}.png`});
              console.log(label,JSON.stringify({base:b,expanded}));
              await p.close();
            }
            async function mobile(){
              const p=await load(390,844);
              const d=await p.evaluate(()=>{const q=s=>document.querySelector(s),r=e=>{const x=e.getBoundingClientRect();return{left:x.left,top:x.top,bottom:x.bottom,width:x.width}};return{arc:r(q('.narr-zone .arc')),axis:r(q('.mobile-arrow-axis')),stats:[...document.querySelectorAll('.narr__stat')].map(x=>({step:x.dataset.step,text:x.innerText.trim()})),titles:[...document.querySelectorAll('.arcade>.mov>.mov__h')].map(x=>x.textContent.trim()),scrollWidth:document.body.scrollWidth,innerWidth}});
              near(d.axis.left+d.axis.width/2,d.arc.left,1.2,'mobile axis/left foot');
              near(d.axis.top,d.arc.bottom,1.2,'mobile axis/spring');
              assert(d.scrollWidth<=d.innerWidth+1,'mobile overflow');
              assert.deepStrictEqual(d.stats.map(x=>x.step),['5','4','3','2','1'],'mobile order');
              d.stats.slice(0,4).forEach(x=>assert(!new RegExp(`^${x.step}\\s+${x.step}\\b`).test(x.text),'duplicate '+x.step));
              assert(/PERCURSO/i.test(d.stats[4].text),'1 PERCURSO missing');
              assert(d.titles.length===3&&/Arquitetura/i.test(d.titles[2]),'mobile continuation');
              await p.screenshot({path:'/tmp/b2b-mobile.png'});
              console.log('mobile',JSON.stringify(d));
              await p.close();
            }
            await desktop(1600,1000,'b2b-1600');
            await desktop(1024,768,'b2b-1024');
            await mobile();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: arco-b2b-browser-validation
          path: |
            /tmp/b2b-1600.png
            /tmp/b2b-1024.png
            /tmp/b2b-mobile.png
          retention-days: 1

      - name: Commit only after browser pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arco.html
          git commit -m 'fix(arco): align 5→1 crossroads to layout geometry [b2b]'
          git push origin b2b
