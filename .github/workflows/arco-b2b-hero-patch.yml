name: ARCO b2b hero patch

on:
  push:
    branches: [b2b]
    paths:
      - '.github/workflows/arco-b2b-hero-patch.yml'
      - 'arco.html'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'prototype hero 5→1 crossroads')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2b
          fetch-depth: 0

      - name: Apply focused hero patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path('arco.html')
          text = path.read_text(encoding='utf-8')
          marker = 'id="hero-5to1-b2b"'

          if marker in text:
              print('ARCO hero 5→1 patch already present; nothing to do.')
              sys.exit(0)

          metrics = '''<ul class="narr__stats">
            <li class="narr__stat" data-step="5">
              <button class="narr__n" type="button" aria-expanded="false" aria-controls="narr-detail-5">5</button>
              <span class="narr__l narr__short">DOMÍNIOS DE ATUAÇÃO</span>
              <span class="narr__l narr__detail" id="narr-detail-5" hidden>5 domínios de atuação organizam 17 mecanismos, traduzidos em ao menos 86 nomenclaturas equivalentes no mercado privado.</span>
            </li>
            <li class="narr__stat" data-step="4">
              <button class="narr__n" type="button" aria-expanded="false" aria-controls="narr-detail-4">4</button>
              <span class="narr__l narr__short">MÓDULOS DE IA JURÍDICA</span>
              <span class="narr__l narr__detail" id="narr-detail-4" hidden>4 módulos de IA jurídica compõem ATRIO: arquitetura decisória end-to-end, local, com 175 testes e base de 115.114 julgados.</span>
            </li>
            <li class="narr__stat" data-step="3">
              <button class="narr__n" type="button" aria-expanded="false" aria-controls="narr-detail-3">3</button>
              <span class="narr__l narr__short">NÚCLEOS DE TRABALHO</span>
              <span class="narr__l narr__detail" id="narr-detail-3" hidden>3 núcleos de trabalho estruturam 10 temáticas derivadas de 102 assuntos; taxonomia aplicada à triagem de 1.792 processos.</span>
            </li>
            <li class="narr__stat" data-step="2">
              <button class="narr__n" type="button" aria-expanded="false" aria-controls="narr-detail-2">2</button>
              <span class="narr__l narr__short">PROJETOS</span>
              <span class="narr__l narr__detail" id="narr-detail-2" hidden>2 projetos implementados e documentados — ECHO e ATRIO — derivados de uma operação jurídica de alto volume.</span>
            </li>
            <li class="narr__stat" data-step="1">
              <b class="narr__n">1</b>
              <span class="narr__l narr__short">PERCURSO</span>
            </li>
          </ul>'''

          pattern = re.compile(
              r'<ul class="narr__stats">\s*'
              r'<li class="narr__stat"><b class="narr__n">60,4%</b>.*?'
              r'</ul>',
              re.S,
          )
          text, count = pattern.subn(metrics, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace exactly one legacy metrics list; replaced {count}.')

          enhancement = r'''

          <!-- b2b: hero 5→1 / eixo central + encruzilhada; camada de override focada -->
          <style id="hero-5to1-b2b">
          @media (min-width:821px){
            /* Mantém o mecanismo legado como fallback, mas a diagonal deixa de ser a camada visível. */
            .narr-zone{ min-height:max(calc(100dvh - var(--pier) - 4rem), 36rem); }
            .narr__svg{ display:none !important; }
            .narr{ pointer-events:none; }
            .narr__stats{
              position:absolute; inset:0; display:block; z-index:1;
            }
            .home.hero-cross-ready .narr__stat{
              position:absolute !important;
              left:calc(var(--cross-axis-x, 50%) + clamp(.72rem,1vw,.92rem)) !important;
              right:0 !important;
              top:var(--cross-top,0px) !important;
              width:auto !important; max-width:none !important;
              display:grid !important;
              grid-template-columns:max-content minmax(0,1fr);
              grid-template-rows:auto auto;
              align-items:baseline;
              column-gap:clamp(.52rem,.8vw,.72rem);
              row-gap:.18rem;
              opacity:0 !important;
              transform:translateY(9px) !important;
              pointer-events:none;
              transition:opacity 620ms var(--ease), transform 620ms var(--ease) !important;
              transition-delay:0ms !important;
            }
            .home.hero-cross-ready.narr-on.cross-sequence .narr__stat{
              opacity:1 !important;
              transform:none !important;
              transition-delay:var(--cross-delay,0ms) !important;
            }
            .home.hero-cross-ready .narr__n{
              grid-column:1; grid-row:1; align-self:baseline;
            }
            .home.hero-cross-ready button.narr__n{
              appearance:none; -webkit-appearance:none;
              border:0; background:none; color:inherit;
              margin:0; padding:0;
              font:inherit; font-family:var(--f-display); font-weight:600;
              font-size:clamp(.85rem,1.35vw,1.18rem); line-height:1;
              letter-spacing:-.03em; font-variant-numeric:tabular-nums;
              cursor:pointer; text-align:left; pointer-events:auto;
            }
            .home.hero-cross-ready button.narr__n:focus-visible{
              outline:1px solid currentColor; outline-offset:3px;
            }
            .home.hero-cross-ready .narr__short{
              grid-column:2; grid-row:1;
              min-width:0; align-self:baseline;
              text-transform:uppercase; letter-spacing:.045em;
            }
            .home.hero-cross-ready .narr__detail{
              grid-column:2; grid-row:2;
              min-width:0; max-width:none;
              padding-right:0;
              white-space:normal; overflow-wrap:normal;
            }
            .home.hero-cross-ready .narr__detail[hidden]{ display:none; }
            .home.hero-cross-ready .narr__stat.is-open .narr__detail{
              animation:narr-detail-in 300ms var(--ease) both;
            }
            @keyframes narr-detail-in{
              from{ opacity:0; transform:translateY(3px); }
              to{ opacity:1; transform:none; }
            }
            .hero-cross-axis,
            .hero-cross-link{
              position:absolute; display:block;
              background:var(--ink); opacity:.5;
              pointer-events:none; z-index:0;
              will-change:transform;
            }
            .hero-cross-axis{
              width:1px; transform:scaleY(0); transform-origin:50% 100%;
            }
            .hero-cross-link{
              height:1px; transform:scaleX(0); transform-origin:100% 50%;
            }
          }

          @media (max-width:820px){
            /* No mobile, preserva-se a topologia integrada: muda a copy, não a física. */
            .hero-cross-axis,.hero-cross-link{ display:none !important; }
            .narr__short{ display:none !important; }
            .narr__detail,
            .narr__detail[hidden]{
              display:block !important;
              grid-column:2 !important; grid-row:1 !important;
              min-width:0;
              white-space:normal; overflow-wrap:anywhere;
            }
            button.narr__n{
              appearance:none; -webkit-appearance:none;
              border:0; background:none; color:inherit;
              margin:0;
              font:inherit; font-family:var(--f-display); font-weight:600;
              font-size:clamp(.85rem,1.35vw,1.18rem); line-height:1;
              letter-spacing:-.03em; font-variant-numeric:tabular-nums;
              text-align:left;
            }
          }

          @media (prefers-reduced-motion:reduce){
            .home.hero-cross-ready .hero-cross-axis{ transform:scaleY(1) !important; }
            .home.hero-cross-ready .hero-cross-link{ transform:scaleX(1) !important; }
            .home.hero-cross-ready .narr__stat{
              opacity:1 !important; transform:none !important;
              transition:none !important;
            }
            .home.hero-cross-ready .narr__detail{ animation:none !important; }
          }
          </style>

          <script id="hero-5to1-b2b-js">
          (() => {
            'use strict';

            const home = document.querySelector('.view[data-view="home"] .home');
            const zone = home && home.querySelector('.narr-zone');
            if (!home || !zone) return;

            const narr = zone.querySelector('.narr');
            const arc = zone.querySelector('.arc');
            const head = zone.querySelector('.bio__head');
            const name = zone.querySelector('.bio__name');
            const stats = [...zone.querySelectorAll('.narr__stat')];
            if (!narr || !arc || !head || !name || stats.length !== 5) return;

            const mq = matchMedia('(max-width:820px)');
            const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
            const numbers = stats.map(stat => stat.querySelector('.narr__n'));
            if (numbers.some(n => !n)) return;

            let axis = narr.querySelector('.hero-cross-axis');
            if (!axis){
              axis = document.createElement('span');
              axis.className = 'hero-cross-axis';
              axis.setAttribute('aria-hidden','true');
              narr.appendChild(axis);
            }
            let link = narr.querySelector('.hero-cross-link');
            if (!link){
              link = document.createElement('span');
              link.className = 'hero-cross-link';
              link.setAttribute('aria-hidden','true');
              narr.appendChild(link);
            }

            const detailOf = stat => stat.querySelector('.narr__detail');
            const buttonOf = stat => stat.querySelector('button.narr__n');
            const detailStats = stats.filter(stat => detailOf(stat) && buttonOf(stat));

            function closeAll(){
              detailStats.forEach(stat => {
                const detail = detailOf(stat);
                const button = buttonOf(stat);
                stat.classList.remove('is-open');
                detail.hidden = true;
                detail.setAttribute('aria-hidden','true');
                button.setAttribute('aria-expanded','false');
              });
            }

            detailStats.forEach(stat => {
              const button = buttonOf(stat);
              const detail = detailOf(stat);
              button.addEventListener('click', () => {
                if (mq.matches) return;
                const shouldOpen = detail.hidden;
                closeAll();
                if (shouldOpen){
                  stat.classList.add('is-open');
                  detail.hidden = false;
                  detail.setAttribute('aria-hidden','false');
                  button.setAttribute('aria-expanded','true');
                }
              });
            });

            let geometry = null;
            let played = false;
            let axisAnimation = null;
            let linkAnimation = null;
            let raf = 0;

            function expandedHeights(){
              return stats.map(stat => {
                const detail = detailOf(stat);
                if (!detail) return Math.ceil(stat.getBoundingClientRect().height);
                const wasHidden = detail.hidden;
                const oldVisibility = detail.style.visibility;
                detail.hidden = false;
                detail.style.visibility = 'hidden';
                const h = Math.ceil(stat.getBoundingClientRect().height);
                detail.style.visibility = oldVisibility;
                detail.hidden = wasHidden;
                return h;
              });
            }

            function layout(){
              if (mq.matches) return null;

              const zr = zone.getBoundingClientRect();
              const ar = arc.getBoundingClientRect();
              const hr = head.getBoundingClientRect();
              const nr = name.getBoundingClientRect();

              const axisX = ar.left - zr.left + ar.width / 2;
              const springY = ar.bottom - zr.top;
              const arcTop = ar.top - zr.top;
              narr.style.setProperty('--cross-axis-x', axisX.toFixed(2) + 'px');

              /* Mede todas as estações no estado expandido para que abrir uma
                 legenda nunca invada a estação seguinte. */
              const heights = expandedHeights();
              const safeArc = Math.max(18, Math.min(28, innerWidth * .014));
              const safeTop = hr.bottom - zr.top + 20;
              const bottomEdge = arcTop - safeArc;

              const pack = gap => {
                const tops = new Array(stats.length);
                tops[0] = bottomEdge - heights[0];
                for (let i = 1; i < stats.length; i++){
                  tops[i] = tops[i - 1] - gap - heights[i];
                }
                return tops;
              };

              let gap = 14;
              let tops = pack(gap);
              const spare = tops[4] - safeTop;
              if (spare > 0){
                gap += Math.min(24, spare / 4);
                tops = pack(gap);
              }
              if (tops[4] < safeTop){
                const deficit = safeTop - tops[4];
                gap = Math.max(7, gap - deficit / 4);
                tops = pack(gap);
              }

              stats.forEach((stat, i) => {
                stat.style.setProperty('--cross-top', tops[i].toFixed(2) + 'px');
              });

              const points = stats.map((stat, i) => {
                const numberRect = numbers[i].getBoundingClientRect();
                return tops[i] + numberRect.height / 2;
              });

              const axisTop = points[4];
              const axisHeight = Math.max(1, springY - axisTop);
              axis.style.left = (axisX - .5).toFixed(2) + 'px';
              axis.style.top = axisTop.toFixed(2) + 'px';
              axis.style.height = axisHeight.toFixed(2) + 'px';

              /* A transversal do 1 cresce em direção à identidade, mas para
                 antes do nome. O topo da estação já está abaixo de bio__head. */
              const nameRight = nr.right - zr.left;
              const targetX = Math.max(0, Math.min(axisX - 56, nameRight + 24));
              link.style.left = targetX.toFixed(2) + 'px';
              link.style.top = (points[4] - .5).toFixed(2) + 'px';
              link.style.width = Math.max(0, axisX - targetX).toFixed(2) + 'px';

              geometry = { points, axisTop, axisHeight, springY };
              return geometry;
            }

            function scheduleLayout(){
              if (raf) cancelAnimationFrame(raf);
              raf = requestAnimationFrame(() => {
                raf = 0;
                layout();
              });
            }

            function play(){
              if (played || mq.matches) return;
              const g = layout();
              if (!g) return;

              const DRAW = 2200;
              const HOLD = 120;
              const total = DRAW + HOLD * 5;
              const arrivals = g.points.map((point, i) => {
                const progress = Math.max(0, Math.min(1, (g.springY - point) / g.axisHeight));
                return progress * DRAW + i * HOLD;
              });

              stats.forEach((stat, i) => {
                stat.style.setProperty('--cross-delay', Math.max(0, arrivals[i] - 120).toFixed(0) + 'ms');
              });

              played = true;
              home.classList.add('cross-sequence');

              if (reduce){
                axis.style.transform = 'scaleY(1)';
                link.style.transform = 'scaleX(1)';
                return;
              }

              const frames = [{ transform:'scaleY(0)', offset:0 }];
              g.points.forEach((point, i) => {
                const progress = Math.max(0, Math.min(1, (g.springY - point) / g.axisHeight));
                const arrival = arrivals[i];
                frames.push({ transform:`scaleY(${progress})`, offset:Math.max(0, Math.min(1, arrival / total)) });
                frames.push({ transform:`scaleY(${progress})`, offset:Math.max(0, Math.min(1, (arrival + HOLD) / total)) });
              });

              axisAnimation?.cancel();
              linkAnimation?.cancel();
              axisAnimation = axis.animate(frames, {
                duration:total,
                easing:'linear',
                fill:'forwards'
              });

              linkAnimation = link.animate(
                [{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }],
                {
                  duration:420,
                  delay:arrivals[4],
                  easing:'cubic-bezier(.22,1,.36,1)',
                  fill:'forwards'
                }
              );
            }

            function syncMode(){
              if (mq.matches){
                detailStats.forEach(stat => {
                  const detail = detailOf(stat);
                  const button = buttonOf(stat);
                  stat.classList.remove('is-open');
                  detail.hidden = false;
                  detail.setAttribute('aria-hidden','false');
                  button.setAttribute('aria-expanded','true');
                });
                return;
              }

              closeAll();
              requestAnimationFrame(() => {
                layout();
                if (home.classList.contains('narr-on')) play();
                else if (played){
                  axis.style.transform = 'scaleY(1)';
                  link.style.transform = 'scaleX(1)';
                  home.classList.add('cross-sequence');
                }
              });
            }

            home.classList.add('hero-cross-ready');
            syncMode();

            const mo = new MutationObserver(() => {
              if (home.classList.contains('narr-on')) play();
            });
            mo.observe(home, { attributes:true, attributeFilter:['class'] });

            mq.addEventListener?.('change', syncMode);
            addEventListener('resize', scheduleLayout, { passive:true });
            addEventListener('orientationchange', scheduleLayout, { passive:true });
            document.fonts?.ready.then(() => requestAnimationFrame(scheduleLayout));

            if (typeof ResizeObserver === 'function'){
              const ro = new ResizeObserver(scheduleLayout);
              ro.observe(zone);
              ro.observe(arc);
              ro.observe(head);
              ro.observe(name);
            }

            if (!mq.matches && home.classList.contains('narr-on')) play();
          })();
          </script>
          '''

          if text.count('</body>') != 1:
              raise SystemExit('Expected exactly one </body> in arco.html.')
          text = text.replace('</body>', enhancement + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Applied focused ARCO hero 5→1 patch.')
          PY

      - name: Validate focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          text = Path('arco.html').read_text(encoding='utf-8')
          assert text.count('id="hero-5to1-b2b"') == 1
          assert text.count('id="hero-5to1-b2b-js"') == 1
          assert len(re.findall(r'<li class="narr__stat" data-step="[1-5]">', text)) == 5
          assert '60,4%' not in re.search(r'<ul class="narr__stats">.*?</ul>', text, re.S).group(0)
          for needle in (
              '5 domínios de atuação organizam 17 mecanismos',
              '4 módulos de IA jurídica compõem ATRIO',
              '3 núcleos de trabalho estruturam 10 temáticas',
              '2 projetos implementados e documentados',
              'hero-cross-axis',
              'hero-cross-link',
              "const targetX = Math.max(0, Math.min(axisX - 56, nameRight + 24))",
          ):
              assert needle in text, needle

          class Parser(HTMLParser):
              pass
          Parser().feed(text)
          print('HTML structure and invariants: OK')

          match = re.search(r'<script id="hero-5to1-b2b-js">(.*?)</script>', text, re.S)
          assert match
          Path('/tmp/hero-5to1.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/hero-5to1.js
          echo 'JavaScript syntax: OK'

      - name: Commit patched hero to b2b
        run: |
          if git diff --quiet -- arco.html; then
            echo 'No arco.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arco.html
          git commit -m 'feat(arco): prototype hero 5→1 crossroads [b2b]'
          git push origin b2b
