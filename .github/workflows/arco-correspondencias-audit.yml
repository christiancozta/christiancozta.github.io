name: Apply ARCO correspondence audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arco-correspondencias-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply correspondence edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          path = Path('arco.html')
          s = path.read_text(encoding='utf-8')
          original = s

          def edit_block(old_title, aliases, new_title=None, new_pt=None, normative=None):
              global s
              needle = f'<span class="verb__t">{html.escape(old_title, quote=False)}</span>'
              if s.count(needle) != 1:
                  raise SystemExit(f'Expected exactly one canonical block for {old_title!r}; found {s.count(needle)}')
              idx = s.index(needle)
              start = s.rfind('<details class="verb"', 0, idx)
              end = s.index('</details>', idx) + len('</details>')
              block = s[start:end]

              if new_title is not None:
                  block = block.replace(
                      needle,
                      f'<span class="verb__t">{html.escape(new_title, quote=False)}</span>',
                      1,
                  )

              if new_pt is not None:
                  block, n = re.subn(
                      r'(<span class="verb__p">)[^<]*(</span>)',
                      lambda m: m.group(1) + html.escape(new_pt, quote=False) + m.group(2),
                      block,
                      count=1,
                  )
                  if n != 1:
                      raise SystemExit(f'Could not update Portuguese label for {old_title!r}')

              alias_re = re.compile(
                  r'\n\s*<div><p class="verb__lbl">Outras nomenclaturas</p><div class="chips">.*?</div></div>',
                  re.S,
              )
              if aliases:
                  pills = ''.join(
                      f'<span class="chip chip--static">{html.escape(alias, quote=False)}</span>'
                      for alias in aliases
                  )
                  replacement = (
                      '\n                  <div><p class="verb__lbl">Outras nomenclaturas</p>'
                      f'<div class="chips">{pills}</div></div>'
                  )
              else:
                  replacement = ''
              block, n = alias_re.subn(replacement, block, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace aliases for {old_title!r}')

              if normative is not None:
                  if '<p class="verb__lbl">Referência normativa</p>' in block:
                      raise SystemExit(f'Normative reference already exists in {old_title!r}')
                  marker = '\n                  <div><p class="verb__lbl">Outras nomenclaturas</p>'
                  if marker not in block:
                      raise SystemExit(f'Could not place normative reference in {old_title!r}')
                  norm = (
                      '\n                  <div><p class="verb__lbl">Referência normativa</p>'
                      f'<p>{html.escape(normative, quote=False)}</p></div>'
                  )
                  block = block.replace(marker, norm + marker, 1)

              s = s[:start] + block + s[end:]

          edits = [
              ('AI Governance', ['Responsible AI', 'IA responsável'], None, None, None),
              ('AI Risk Management', ['AI Risk Controls', 'Controles de risco'], None, None, None),
              ('Business Process Management', ['Process Management', 'Gestão de processos'], None, None, None),
              ('Business Rules', ['Decision Logic', 'Critérios de bloqueio'], None, None, None),
              ('Context Engineering', ['Context Selection', 'Seleção de contexto'], None, None, None),
              ('Data Governance', [], None, None, None),
              ('Decision Support System', ['Decision Engineering', 'Engenharia de decisão'], None, None, None),
              ('Document Automation', ['Doc Generation', 'Geração assistida'], None, None, None),
              ('Documentation', ['Technical Writing', 'Redação técnica'], None, None, None),
              ('Explainability', ['Reconstruction of Decision Path'], 'Process Explainability', 'Explicabilidade do processo', None),
              ('Information Architecture', ['Findability', 'Organização para recuperação'], None, None, None),
              ('Information Extraction', ['Data Enrichment', 'Structured Extraction', 'Document Understanding'], None, None, None),
              ('Knowledge Capture', ['Knowledge Elicitation', 'Operational Discovery', 'Escuta operacional'], None, None, None),
              ('Knowledge Management', ['Knowledge Base', 'Organizational Learning', 'Aprendizagem organizacional'], None, None, None),
              ('Legal Design', ['Information Design', 'Design da informação'], None, None, None),
              ('Model Evaluation', ['AI Evaluation', 'LLM Evaluation', 'Evals', 'Comparative Evaluation'], 'LLM & Output Evaluation', 'Avaliação de LLM e saídas', None),
              ('Privacy by Design', ['Privacy Engineering', 'Pseudonymization', 'Data Protection'], None, None, 'LGPD (Lei nº 13.709/2018).'),
              ('Process Improvement', ['Continuous Improvement', 'Melhoria contínua'], None, None, None),
              ('Process Mapping', ['AS-IS Mapping'], None, None, None),
              ('Product Thinking', ['Business Analysis', 'Análise de negócios'], None, None, None),
              ('Quality Gates', ['Quality Assurance', 'Control Points', 'Garantia da qualidade'], None, None, None),
              ('Red Teaming', ['Adversarial Evaluation', "Devil's Advocate Review"], 'Adversarial Review', 'Revisão adversarial', None),
              ('Risk Assessment', ['Risk Controls', 'Mitigação', 'Controles'], None, None, None),
              ('Root Cause Analysis', ['Análise de causa'], None, None, None),
              ('Standard Operating Procedures', ['Playbooks', 'Operating Procedures', 'POP'], None, None, None),
          ]

          for old_title, aliases, new_title, new_pt, normative in edits:
              edit_block(old_title, aliases, new_title, new_pt, normative)

          refs = [
              (
                  'data-goto="iax-10" data-label="Explicabilidade">Explainability</button>',
                  'data-goto="iax-10" data-label="Explicabilidade do processo">Process Explainability</button>',
              ),
              (
                  'data-goto="iax-07" data-label="Avaliação de modelos">Model Evaluation</button>',
                  'data-goto="iax-07" data-label="Avaliação de LLM e saídas">LLM &amp; Output Evaluation</button>',
              ),
              (
                  'data-goto="iax-06" data-label="Confronto adversarial">Red Teaming</button>',
                  'data-goto="iax-06" data-label="Revisão adversarial">Adversarial Review</button>',
              ),
          ]
          for old, new in refs:
              count = s.count(old)
              if count < 1:
                  raise SystemExit(f'Expected at least one internal reference: {old}')
              s = s.replace(old, new)

          hero_re = re.compile(
              r'organizando 17 mecanismos, com ao menos \d+ nomenclaturas equivalentes(?: usadas)? no mercado privado\.'
          )
          s, hero_count = hero_re.subn(
              'organizando 17 mecanismos, com ao menos 46 correspondências terminológicas usadas no mercado privado.',
              s,
          )
          if hero_count != 2:
              raise SystemExit(f'Expected two hero nomenclature claims; updated {hero_count}')

          s = s.replace('nomenclaturas equivalentes', 'nomenclaturas de mercado associadas')
          s = s.replace('·', '|')

          dict_open = '<div class="dict dict--alphabetical" id="eq-dicionario">'
          sentinel = '\n            </div>\n          </div>\n          </div>\n\n          <!-- ===== 05;'
          dict_start = s.index(dict_open)
          dict_end = s.index(sentinel, dict_start)
          region = s[dict_start:dict_end]
          blocks = re.findall(r'\n\s*<details class="verb" id="[^"]+">.*?</details>', region, re.S)
          if len(blocks) != 46:
              raise SystemExit(f'Expected 46 correspondence blocks; found {len(blocks)}')

          def canonical_title(block):
              m = re.search(r'<span class="verb__t">(.*?)</span>', block, re.S)
              if not m:
                  raise SystemExit('Correspondence block without canonical title')
              return html.unescape(m.group(1)).casefold()

          first = region.find(blocks[0])
          last = region.rfind(blocks[-1]) + len(blocks[-1])
          region = region[:first] + ''.join(sorted(blocks, key=canonical_title)) + region[last:]
          s = s[:dict_start] + region + s[dict_end:]

          dict_start = s.index(dict_open)
          dict_end = s.index(sentinel, dict_start)
          dict_region = s[dict_start:dict_end]

          forbidden_aliases = [
              'Governance Framework', 'AI Safety', 'Segurança de IA', 'Contenção',
              'Operating Model', 'Operational Excellence', 'Modelo operacional', 'Excelência operacional',
              'Rules engine', 'Decision tables', 'Context window management',
              'Document Lifecycle Management', 'Ciclo de vida documental',
              'Decision Intelligence', 'Inteligência de decisão', 'Document Assembly', 'Templates',
              'Content Operations', 'Content Governance', 'XAI', 'Interpretabilidade', 'Justificação',
              'Information Retrieval', 'Recuperação da informação', 'NLP', 'Entity Extraction',
              'Discovery', 'Knowledge Engineering', 'Visual Law', 'Service Design',
              'Benchmarking', 'Eval', 'LGPD', 'Pseudoanonimização', 'Data Masking', 'Anonimização', 'Minimização',
              'Kaizen', 'Value Stream Mapping', 'Product Strategy', 'Estratégia de produto',
              'Stage-Gate', 'Red Teaming', 'Devil’s advocate', 'Estresse',
              'Risk matrix', '5 Whys', 'Runbooks',
          ]
          for alias in forbidden_aliases:
              pill = f'<span class="chip chip--static">{html.escape(alias, quote=False)}</span>'
              if pill in dict_region:
                  raise SystemExit(f'Forbidden alias still present: {alias}')

          required = [
              '<span class="verb__t">Process Explainability</span>',
              '<span class="verb__t">LLM &amp; Output Evaluation</span>',
              '<span class="verb__t">Adversarial Review</span>',
              '<span class="chip chip--static">Playbooks</span><span class="chip chip--static">Operating Procedures</span><span class="chip chip--static">POP</span>',
              '<p class="verb__lbl">Referência normativa</p><p>LGPD (Lei nº 13.709/2018).</p>',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit(f'Required result missing: {item}')

          if '·' in s:
              raise SystemExit('Middle-dot separator remains in arco.html')
          if 'nomenclaturas equivalentes' in s:
              raise SystemExit('Old equivalence wording remains in arco.html')
          if s == original:
              raise SystemExit('No changes produced')

          path.write_text(s, encoding='utf-8')
          PY

          git diff --check -- arco.html
          git diff --quiet -- arco.html && { echo 'No arco.html changes'; exit 1; }

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "ARCO correspondence audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git commit -m "refactor(arco): depurar correspondências de mercado"
          git push origin HEAD:main
