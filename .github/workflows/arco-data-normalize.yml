name: Normalize DATA child integration

on:
  push:
    paths:
      - '.github/workflows/arco-data-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Normalize DATA integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arco = Path('arco.html')
          text = arco.read_text(encoding='utf-8')

          old_script = '<script src="assets/arco/js/arco.js?v=20260829-piso" defer></script>'
          new_script = '<script src="assets/arco/js/arco.js?v=20260901-data" defer></script>'
          assert text.count(old_script) == 1, 'ARCO script tag baseline changed'
          text = text.replace(old_script, new_script, 1)

          old_link = '<a class="rail__link rail__link--data" href="data.html">DATA</a>'
          new_link = '<button class="rail__link rail__link--data" type="button" data-view="data">DATA</button>'
          assert text.count(old_link) == 1, 'DATA rail link baseline changed'
          text = text.replace(old_link, new_link, 1)

          atrio = '''    <!-- ===================== FILHO: ATRIO ===================== -->
    <section class="view" data-view="atrio" aria-label="ATRIO">
      <div class="child child--atrio">
        <div class="child__bar">
          <a class="child__full" href="atrio.html" target="_blank" rel="noopener">
            Prefere a página inteira? Por aqui <span class="arrow" aria-hidden="true">→</span>
          </a>
          <span class="child__load" aria-hidden="true"></span>
        </div>
        <iframe class="child__frame" title="ATRIO — página completa" src="about:blank" data-src="atrio.html" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    </section>
'''
          data = '''
    <!-- ===================== FILHO: DATA ===================== -->
    <section class="view" data-view="data" aria-label="DATA">
      <div class="child child--data">
        <div class="child__bar">
          <a class="child__full" href="data.html" target="_blank" rel="noopener">
            Prefere a página inteira? Por aqui <span class="arrow" aria-hidden="true">→</span>
          </a>
          <span class="child__load" aria-hidden="true"></span>
        </div>
        <iframe class="child__frame" title="DATA — página completa" src="about:blank" data-src="data.html" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    </section>
'''
          assert text.count(atrio) == 1, 'ATRIO child baseline changed'
          assert 'data-src="data.html"' not in text, 'DATA child already declared'
          text = text.replace(atrio, atrio + data, 1)
          arco.write_text(text, encoding='utf-8')

          core = Path('assets/arco/js/arco-core.js')
          target = Path('assets/arco/js/arco.js')
          assert core.exists(), 'Preserved ARCO core missing'
          target.write_text(core.read_text(encoding='utf-8'), encoding='utf-8')
          core.unlink()
          PY

      - name: Commit normalized structure
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html assets/arco/js/arco.js assets/arco/js/arco-core.js
          git commit -m "Integrate DATA as third ARCO child"
          git push origin main
