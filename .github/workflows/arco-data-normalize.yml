name: Normalize DATA child integration

on:
  push:
    paths:
      - '.github/data-normalize-trigger-2'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize DATA integration
        run: python3 .github/scripts/normalize_data_child.py
      - name: Commit normalized structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A arco.html assets/arco/js/arco.js assets/arco/js/arco-core.js
          git commit -m "Integrate DATA as third ARCO child"
          git push origin main
