name: ARCO favicon one-shot

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/arco-favicon-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ARCO favicon
        run: python tools/arco-favicon-once.py

      - name: Commit favicon update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arco-favicon-once.yml tools/arco-favicon-once.py
          git add arco.html assets/arco/brand/
          git commit -m "Add ARCO favicon variants"
          git push origin HEAD:main
