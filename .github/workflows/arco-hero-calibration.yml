name: ARCO hero calibration

on:
  push:
    branches:
      - audit/arco-hero-consolidation-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Serve branch locally
        run: |
          python -m http.server 4183 --bind 127.0.0.1 >/tmp/arco-calibration-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4183/arco.html >/dev/null

      - name: Calibrate assertions
        run: python .arco-audit/calibrate.py

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arco-hero-calibration-${{ github.run_id }}
          path: .arco-audit/calibration.json
          retention-days: 7
