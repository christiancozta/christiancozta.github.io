name: ARCO hero equivalence

on:
  push:
    branches:
      - audit/arco-hero-consolidation-20260906
    paths-ignore:
      - '.arco-audit/results/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: current

      - name: Checkout immutable baseline
        uses: actions/checkout@v4
        with:
          ref: f116a1d3d9671f2ac016b9147d85004c59955935
          path: baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser audit dependencies
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.55.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium

      - name: Serve baseline and candidate locally
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory baseline >/tmp/arco-baseline-server.log 2>&1 &
          echo $! >/tmp/arco-baseline-server.pid
          python -m http.server 4183 --bind 127.0.0.1 --directory current >/tmp/arco-current-server.log 2>&1 &
          echo $! >/tmp/arco-current-server.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/arco.html >/dev/null
          curl --fail --silent http://127.0.0.1:4183/arco.html >/dev/null

      - name: Audit baseline against candidate
        run: |
          python current/.arco-audit/audit.py \
            --baseline-url http://127.0.0.1:4173 \
            --current-url http://127.0.0.1:4183 \
            --out current/.arco-audit/results

      - name: Print audit summary
        if: always()
        run: |
          if [ -f current/.arco-audit/results/summary.json ]; then
            cat current/.arco-audit/results/summary.json
          fi

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arco-hero-equivalence-${{ github.run_id }}
          path: current/.arco-audit/results
          if-no-files-found: warn
          retention-days: 7
