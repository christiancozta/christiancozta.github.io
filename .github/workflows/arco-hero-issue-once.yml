name: Apply Arco hero patch once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[ops] Apply Arco hero patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine hero narrative and preserve arc geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("arco.html")
          s = p.read_text(encoding="utf-8")

          old_css = '''.hero__txt, .narr-zone .arc{ margin-top:auto; }

.narr{'''
          new_css = '''.hero__txt, .narr-zone .arc{ margin-top:auto; }

/* O novo percurso equivale a 8 linhas: duas pausas de meia linha.
   No desktop, o bloco cresce para cima e preserva o respiro validado diante do arco. */
.mov__pause{ display:block; height:.84em; }
@media (min-width:821px){
  .hero__txt{ position:relative; top:-2.8rem; }
}

.narr{'''
          assert s.count(old_css) == 1, "hero CSS anchor changed"
          s = s.replace(old_css, new_css, 1)

          old_hero = '''        <!-- PERCURSO -->
        <div class="hero__txt" data-reveal="">
          <h1 class="mov__h">Narrativa de percurso</h1>
          <p class="mov__t">
            Da execução fiscal à <em>regência recursal</em>.<br>
            Da regência à <em>arquitetura do raciocínio</em>.<br>
            Um movimento exigiu o outro.<br>
            Método antes da automação.
          </p>
        </div>'''
          new_hero = '''        <!-- PERCURSO -->
        <div class="hero__txt" data-reveal="">
          <h1 class="mov__h">Narrativa de percurso</h1>
          <p class="mov__t">
            Da gestão judicial ao método.<br>
            Do método à arquitetura de IA.<br>
            Um movimento exigiu o outro.
            <span class="mov__pause" aria-hidden="true"></span>
            Este portfólio narra uma trajetória<br>
            na encruzilhada entre operações jurídicas,<br>
            tecnologia, dados e governança.
            <span class="mov__pause" aria-hidden="true"></span>
            <em>Tradução disponível durante o percurso.</em>
          </p>
        </div>'''
          assert s.count(old_hero) == 1, "hero copy anchor changed"
          s = s.replace(old_hero, new_hero, 1)

          assert s.count('class="mov__pause"') == 2
          assert s.count('top:-2.8rem') == 1
          assert s.count('Tradução disponível durante o percurso.') == 1
          assert s.count('Da gestão judicial ao método.') == 1
          assert s.count('Do método à arquitetura de IA.') == 1

          p.write_text(s, encoding="utf-8")
          PY

          git diff --check -- arco.html

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git rm .github/workflows/arco-hero-issue-once.yml
          git diff --cached --check
          git commit -m "feat(arco): refine hero percurso narrative"
          git push origin HEAD:main
