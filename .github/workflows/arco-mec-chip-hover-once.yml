name: Clean ARCO mechanism chip hover once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arco-mec-chip-hover-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate arco.html
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object arco.html)" = "06484ef18e9a17454971ca6441404889e64db3ab"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('arco.html')
          before = p.read_text(encoding='utf-8')
          s = before

          # Work only inside the 17 visible equivalence chip groups in mechanisms.
          group_pat = re.compile(r'(?ms)<span class="chips mec__chips">.*?</span>')
          groups = list(group_pat.finditer(before))
          assert len(groups) == 17, len(groups)

          button_pat = re.compile(r'(<button class="chip"[^>]*\bdata-label=")([^"]+)("[^>]*>.*?</button>)', re.S)
          counts = {'buttons': 0, 'changed': 0}

          def clean_group(m):
              group = m.group(0)
              def clean_button(bm):
                  label = bm.group(2)
                  counts['buttons'] += 1
                  assert ';' in label, label
                  second = label.split(';', 1)[1].strip()
                  assert second, label
                  counts['changed'] += 1
                  return bm.group(1) + second + bm.group(3)
              return button_pat.sub(clean_button, group)

          s = group_pat.sub(clean_group, s)

          assert counts['buttons'] > 0
          assert counts['changed'] == counts['buttons']

          # Postconditions: mechanism-chip tooltips now contain only the translated label.
          new_groups = group_pat.findall(s)
          assert len(new_groups) == 17
          for group in new_groups:
              buttons = list(button_pat.finditer(group))
              assert buttons
              for bm in buttons:
                  assert ';' not in bm.group(2), bm.group(2)

          # Scope guards: visible button text and navigation targets remain byte-identical.
          def mechanism_chip_buttons(text):
              out = []
              for g in group_pat.findall(text):
                  out.extend(re.findall(r'<button class="chip"[^>]*>.*?</button>', g, re.S))
              return out

          old_buttons = mechanism_chip_buttons(before)
          new_buttons = mechanism_chip_buttons(s)
          assert len(old_buttons) == len(new_buttons) == counts['buttons']

          strip_label = lambda x: re.sub(r'\sdata-label="[^"]*"', '', x)
          assert [strip_label(x) for x in old_buttons] == [strip_label(x) for x in new_buttons]

          # Everything outside the mechanism chip groups is byte-identical.
          assert group_pat.sub('<MEC_CHIPS/>', before) == group_pat.sub('<MEC_CHIPS/>', s)

          p.write_text(s, encoding='utf-8')
          print({'mechanism_chip_groups': 17, 'labels_cleaned': counts['changed']})
          PY

          git diff --check -- arco.html

      - name: Commit and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- arco.html
          git rm -- .github/workflows/arco-mec-chip-hover-once.yml
          git diff --cached --check
          git commit -m "refactor(arco): simplifica hover dos chips"
          git push origin HEAD:main
