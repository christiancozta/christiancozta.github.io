name: Apply ARCO mechanism chips patch on push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arco-mecanismos-chips-push-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate arco.html
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object arco.html)" = "1d1871e1a4716c0d7f8f9f07d013acaeee448e25"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('arco.html')
          before = p.read_text(encoding='utf-8')
          s = before

          assert before.count('<details class="mec" id=') == 17
          assert before.count('class="mec__eq"') == 17
          assert before.count('<p class="verb__lbl">Equivalências associadas</p>') == 17
          assert 'class="chips mec__chips"' not in before

          def detail_ranges(text, klass):
              starts = list(re.finditer(r'<details class="' + re.escape(klass) + r'"\b[^>]*>', text))
              token = re.compile(r'<details\b[^>]*>|</details>')
              out = []
              for st in starts:
                  depth = 0
                  for m in token.finditer(text, st.start()):
                      depth += 1 if m.group(0).startswith('<details') else -1
                      if depth == 0:
                          out.append((st.start(), m.end()))
                          break
                  else:
                      raise AssertionError((klass, st.start()))
              return out

          attrs_before = {
              key: re.findall(r'\b' + re.escape(key) + r'="[^"]*"', before)
              for key in ('id', 'data-goto', 'data-anchor', 'data-label', 'data-reveal')
          }
          attrs_before['style-i'] = re.findall(r'style="--i:[^"]+"', before)
          chip_buttons_before = re.findall(r'<button class="chip"\b[^>]*>.*?</button>', before, re.S)

          d0 = before.index('<!-- ===== 04; PARTE II — DICIONÁRIO DE EQUIVALÊNCIAS ===== -->')
          d1 = before.index('<!-- ===== 05; METODOLOGIA ===== -->', d0)
          dictionary_before = before[d0:d1]

          ranges = detail_ranges(before, 'mec')
          assert len(ranges) == 17
          moved_buttons = []

          body_eq = re.compile(
              r'(?ms)^(?P<outer>[ \t]*)<div><p class="verb__lbl">Equivalências associadas</p>\n'
              r'(?P<inner>[ \t]*)<div class="chips">\n'
              r'(?P<buttons>.*?)'
              r'(?P=inner)</div>\n'
              r'(?P=outer)</div>\n?'
          )
          summary_eq = re.compile(r'(?m)^(?P<indent>[ \t]*)<span class="mec__eq">[^<]*</span>\n')

          for a, b in reversed(ranges):
              card = s[a:b]
              bm = body_eq.search(card)
              assert bm
              buttons = re.findall(r'<button class="chip"\b[^>]*>.*?</button>', bm.group('buttons'), re.S)
              assert buttons
              moved_buttons[0:0] = buttons

              card, n_body = body_eq.subn('', card, count=1)
              assert n_body == 1
              sm = summary_eq.search(card)
              assert sm
              indent = sm.group('indent')
              visible = (
                  indent + '<span class="chips mec__chips">\n' +
                  '\n'.join(indent + '  ' + btn.strip() for btn in buttons) + '\n' +
                  indent + '</span>\n'
              )
              card = card[:sm.start()] + visible + card[sm.end():]

              labels = re.findall(r'<p class="verb__lbl">([^<]+)</p>', card)
              assert labels == ['Problema ao qual responde', 'Mecanismo implementado', 'Evidências', 'Origem'], labels
              s = s[:a] + card + s[b:]

          old_p = '.mec__p{ display:block; margin-top:.1rem; color:var(--ink-70); font-size:.78rem; line-height:1.3; }\n'
          new_p = '.mec__p{ display:block; margin-top:.1rem; color:var(--ink-70); font-size:.78rem; line-height:1.3; font-style:italic; }\n'
          assert s.count(old_p) == 1
          s = s.replace(old_p, new_p, 1)

          old_eq_css = re.compile(
              r'(?ms)/\* a lista fechada é leitura, não controle:.*?\*/\n'
              r'\.mec__eq\{\n.*?^\}\n'
          )
          s, n_css = old_eq_css.subn(
              '/* equivalências ficam aparentes no estado fechado; o JS impede que o clique\n'
              '   no chip acione também a abertura da gaveta. */\n'
              '.mec__chips{\n'
              '  margin-top:.75rem; align-items:center;\n'
              '}\n',
              s,
              count=1,
          )
          assert n_css == 1, n_css

          body_p = '.mec__body p{ margin:0; font-size:.85rem; line-height:1.68; color:var(--ink-78); text-wrap:pretty; }\n'
          body_lbl = '.mec__body p.verb__lbl{ font-weight:700; color:var(--ink); }\n'
          assert s.count(body_p) == 1
          assert body_lbl not in s
          s = s.replace(body_p, body_p + body_lbl, 1)

          js_pat = re.compile(
              r'btn\.addEventListener\("click", \(\) => \{\n(?P<indent>[ \t]*)const target = document\.getElementById\(btn\.dataset\.goto\);'
          )
          jm = js_pat.search(s)
          assert jm
          indent = jm.group('indent')
          js_repl = (
              'btn.addEventListener("click", event => {\n'
              + indent + 'if (btn.closest(".mec > summary")) event.stopPropagation();\n'
              + indent + 'const target = document.getElementById(btn.dataset.goto);'
          )
          s, n_js = js_pat.subn(js_repl, s, count=1)
          assert n_js == 1

          assert s.count('<details class="mec" id=') == 17
          assert s.count('class="mec__eq"') == 0
          assert s.count('<p class="verb__lbl">Equivalências associadas</p>') == 0
          assert s.count('class="chips mec__chips"') == 17
          assert s.count('.mec__body p.verb__lbl{ font-weight:700; color:var(--ink); }') == 1
          assert s.count('if (btn.closest(".mec > summary")) event.stopPropagation();') == 1

          cards_after = [s[a:b] for a, b in detail_ranges(s, 'mec')]
          visible_buttons = []
          for card in cards_after:
              wm = re.search(r'(?ms)<span class="chips mec__chips">(.*?)</span>', card)
              assert wm
              visible_buttons.extend(re.findall(r'<button class="chip"\b[^>]*>.*?</button>', wm.group(1), re.S))
              labels = re.findall(r'<p class="verb__lbl">([^<]+)</p>', card)
              assert labels == ['Problema ao qual responde', 'Mecanismo implementado', 'Evidências', 'Origem']

          assert visible_buttons == moved_buttons
          for key, old in attrs_before.items():
              now = re.findall(r'style="--i:[^"]+"', s) if key == 'style-i' else re.findall(r'\b' + re.escape(key) + r'="[^"]*"', s)
              assert now == old, key
          assert re.findall(r'<button class="chip"\b[^>]*>.*?</button>', s, re.S) == chip_buttons_before

          nd0 = s.index('<!-- ===== 04; PARTE II — DICIONÁRIO DE EQUIVALÊNCIAS ===== -->')
          nd1 = s.index('<!-- ===== 05; METODOLOGIA ===== -->', nd0)
          assert s[nd0:nd1] == dictionary_before

          p.write_text(s, encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', s, re.S)
          for i, body in enumerate(scripts):
              Path(f'/tmp/arco-script-{i}.js').write_text(body, encoding='utf-8')
          print('validated mechanisms:', len(cards_after))
          PY

          for f in /tmp/arco-script-*.js; do node --check "$f"; done
          git diff --check -- arco.html

      - name: Commit patch and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- arco.html
          git rm -- .github/workflows/arco-mecanismos-chips-once.yml .github/workflows/arco-mecanismos-chips-push-once.yml
          git diff --cached --check
          git commit -m "refactor(arco): expõe equivalências nos mecanismos"
          git push origin HEAD:main
