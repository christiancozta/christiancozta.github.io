name: ARCO mobile nav and credentials once

on:
  push:
    branches:
      - fix/arco-mobile-nav-creds
    paths:
      - '.github/workflows/arco-mobile-nav-creds-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arco-mobile-nav-creds
          fetch-depth: 0

      - name: Patch arco.html
        shell: python
        run: |
          from pathlib import Path

          p = Path('arco.html')
          s = p.read_text(encoding='utf-8')

          old_mobile = '''@media (max-width:820px){\n  /* MOBILE — o cordão vira topo; o palco desce inteiro   [DINÂMICA INTOCADA] */\n  .arcade{ grid-template-columns:1fr; }'''
          new_mobile = '''@media (max-width:820px){\n  /* MOBILE — uma única linha: ARCO + navegação principal. Subníveis ficam\n     reservados ao desktop/tablet; aqui o cordão é orientação, não índice. */\n  .rail{\n    flex-wrap:nowrap;\n    justify-content:flex-start;\n    gap:clamp(.65rem,2.6vw,.95rem);\n    padding:.82rem max(.9rem, env(safe-area-inset-right, 0px))\n            .82rem max(.9rem, env(safe-area-inset-left, 0px));\n  }\n  .rail__id{ flex:0 0 auto; }\n  .rail__index{ flex:1 1 auto; min-width:0; }\n  .rail__nav{\n    width:100%; flex-wrap:nowrap; justify-content:flex-end;\n    gap:clamp(.42rem,2vw,.72rem);\n  }\n  .rail__link{\n    flex:0 0 auto; white-space:nowrap;\n    font-size:clamp(.70rem,3vw,.82rem);\n  }\n  .rail__sec{ display:none !important; }\n\n  /* MOBILE — o cordão vira topo; o palco desce inteiro */\n  .arcade{ grid-template-columns:1fr; }'''
          if old_mobile not in s:
              raise SystemExit('mobile breakpoint anchor not found')
          s = s.replace(old_mobile, new_mobile, 1)

          marker = '''  .mec__x{ grid-column:2; grid-row:1; }\n}\n\n/* ===========================================================================\n   REVELAÇÃO'''
          insert_css = '''  .mec__x{ grid-column:2; grid-row:1; }\n}\n\n/* Credenciais flutuantes: inexistem fora do mobile; no celular substituem o\n   rodapé do rail sem ocupar altura do topo. */\n.mobile-cred{ display:none; }\n@media (max-width:820px){\n  .mobile-cred{\n    display:block; position:fixed; z-index:70;\n    right:max(1rem, env(safe-area-inset-right, 0px));\n    bottom:calc(1rem + env(safe-area-inset-bottom, 0px));\n  }\n  .mobile-cred > summary{ list-style:none; }\n  .mobile-cred > summary::-webkit-details-marker{ display:none; }\n  .mobile-cred__toggle{\n    width:2.65rem; height:2.65rem;\n    display:grid; place-items:center;\n    margin-left:auto; padding:0; cursor:pointer;\n    border:1px solid rgba(255,255,255,.18); border-radius:0;\n    background:var(--ink); color:var(--paper);\n    box-shadow:0 8px 24px rgba(0,0,0,.16);\n  }\n  .mobile-cred__toggle svg{ width:1.05rem; height:1.05rem; display:block; }\n  .mobile-cred__panel{\n    position:absolute; right:0; bottom:calc(100% + .6rem);\n    width:min(17rem, calc(100vw - 2rem));\n    padding:1rem 1.05rem 1.05rem;\n    background:var(--ink); color:var(--paper);\n    border:1px solid var(--hair-inv);\n    box-shadow:0 12px 30px rgba(0,0,0,.2);\n  }\n  .mobile-cred__links{\n    display:flex; align-items:baseline; flex-wrap:wrap;\n    gap:.3rem .48rem; margin:0 0 .9rem;\n    font-family:var(--f-micro); font-size:.58rem; line-height:1.5;\n    letter-spacing:.04em; color:var(--pp-58);\n  }\n  .mobile-cred__links a{\n    color:var(--pp-58); text-decoration:none; padding-bottom:1px; white-space:nowrap;\n    background-image:linear-gradient(var(--hair-inv),var(--hair-inv));\n    background-size:100% 1px; background-repeat:no-repeat; background-position:0 100%;\n  }\n  .mobile-cred__links i{ font-style:normal; color:var(--hair-inv); }\n  .mobile-cred__name{\n    margin:0; font-family:var(--f-display); font-weight:600; font-size:1.02rem;\n    line-height:1.1; letter-spacing:-.03em; color:var(--paper);\n  }\n  .mobile-cred__sub{\n    margin:.5rem 0 0; font-family:var(--f-micro); font-size:.58rem;\n    line-height:1.5; letter-spacing:.12em; text-transform:uppercase; color:var(--pp-58);\n  }\n  .mobile-cred__sub i{ font-style:normal; color:var(--hair-inv); margin:0 .2rem; }\n}\n\n/* ===========================================================================\n   REVELAÇÃO'''
          if marker not in s:
              raise SystemExit('CSS insertion anchor not found')
          s = s.replace(marker, insert_css, 1)

          html_anchor = '''  </nav>\n\n  <main class="stage" id="stage" tabindex="-1">'''
          html_insert = '''  </nav>\n\n  <details class="mobile-cred">\n    <summary class="mobile-cred__toggle" aria-label="Abrir credenciais de Christian da Costa">\n      <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">\n        <path fill="currentColor" fill-rule="evenodd" d="M0,0 H120 V120 H0 Z M22,30 L60,60 L22,90 Z M98,30 L60,60 L98,90 Z"></path>\n      </svg>\n    </summary>\n    <div class="mobile-cred__panel">\n      <p class="mobile-cred__links">\n        <a href="https://christiancozta.github.io/CV-Christian_daCosta.pdf" target="_blank" rel="noopener">CV</a>\n        <i aria-hidden="true">|</i>\n        <a href="https://www.linkedin.com/in/christiandcosta" target="_blank" rel="noopener">LinkedIn</a>\n        <i aria-hidden="true">|</i>\n        <a href="mailto:christiandscosta@gmail.com">E-mail</a>\n        <i aria-hidden="true">|</i>\n        <a href="https://wa.me/5541991521304" target="_blank" rel="noopener">WhatsApp</a>\n      </p>\n      <p class="mobile-cred__name">Christian da Costa</p>\n      <p class="mobile-cred__sub">LAW <i aria-hidden="true">|</i> OPS <i aria-hidden="true">|</i> AI</p>\n    </div>\n  </details>\n\n  <main class="stage" id="stage" tabindex="-1">'''
          if html_anchor not in s:
              raise SystemExit('HTML insertion anchor not found')
          s = s.replace(html_anchor, html_insert, 1)

          p.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow and commit patch
        run: |
          git rm .github/workflows/arco-mobile-nav-creds-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git commit -m "feat(arco): ajusta navegação e credenciais no mobile"
          git push origin HEAD:fix/arco-mobile-nav-creds
