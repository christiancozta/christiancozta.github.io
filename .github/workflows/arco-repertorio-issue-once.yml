name: Apply ARCO repertorio patch once

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[ops] Apply ARCO repertorio patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate approved repertorio patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object arco.html)" = "9acff5d407491983bac56a1914316b1c65010629"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('arco.html')
          before = p.read_text(encoding='utf-8')
          s = before

          # Baseline: fail closed if the reviewed source moved.
          assert before.count('<details class="mec" id=') == 17
          assert before.count('<details class="verb" id=') == 46
          assert before.count('<details class="grp" data-reveal="">') == 5
          assert before.count('<header class="mecdom">') == 5
          assert before.count('<p class="verb__lbl">Definição</p>') == 46
          assert before.count('<p class="verb__lbl">O que isso resolve no privado</p>') == 46
          assert before.count('<p class="verb__lbl">Demonstrada por</p>') == 46
          assert before.count('<p class="verb__lbl">Também chamado de</p>') == 46
          assert before.count('<p class="verb__lbl">Referência normativa</p>') == 1
          assert before.count('<p class="verb__lbl">Ressalva de escopo</p>') == 1

          def detail_blocks(text, klass):
              starts = list(re.finditer(r'<details class="' + re.escape(klass) + r'"\b[^>]*>', text))
              token = re.compile(r'<details\b[^>]*>|</details>')
              out = []
              for st in starts:
                  depth = 0
                  for m in token.finditer(text, st.start()):
                      depth += 1 if m.group(0).startswith('<details') else -1
                      if depth == 0:
                          out.append(text[st.start():m.end()])
                          break
                  else:
                      raise AssertionError((klass, st.start()))
              return out

          mecs_before = detail_blocks(before, 'mec')
          scripts_before = re.findall(r'<script\b[^>]*>.*?</script>', before, re.S)
          attrs_before = {
              key: re.findall(r'\b' + re.escape(key) + r'="[^"]*"', before)
              for key in ('id', 'data-goto', 'data-anchor', 'data-label', 'data-reveal')
          }
          attrs_before['style-i'] = re.findall(r'style="--i:[^"]+"', before)
          chips_before = re.findall(r'<button class="chip"\b[^>]*>', before)

          # 1) Section numbers disappear.
          s, n = re.subn(r'(?m)^[ \t]*<span class="eqhead__k">(?:02|03|04|05)</span>\n', '', s)
          assert n == 4, n

          # 2) Domain and dictionary group numbers become seals.
          s, n = re.subn(
              r'<header class="mecdom"><h4>(0[1-5]); ([^<]+)</h4>',
              lambda m: f'<header class="mecdom"><h4><span class="mecdom__c">{m.group(1)}</span> {m.group(2)}</h4>',
              s,
          )
          assert n == 5, n

          s, n = re.subn(
              r'<summary><h4>([A-E]); ([^<]+)</h4><span class="grp__n">',
              lambda m: f'<summary><h4><span class="grp__c">{m.group(1)}</span> {m.group(2)}</h4><span class="grp__n">',
              s,
          )
          assert n == 5, n

          # 3) Dictionary intro loses only the redundant sentence.
          old_intro = (
              '            As entradas seguintes não ampliam o número de entregas. Traduzem os mecanismos\n'
              '            implementados para categorias reconhecíveis pelo mercado privado.\n'
          )
          assert s.count(old_intro) == 1
          s = s.replace(
              old_intro,
              '            Traduzem os mecanismos implementados para categorias reconhecíveis pelo mercado privado.\n',
              1,
          )

          # 4) Dictionary becomes lookup: remove ONLY the two approved prose blocks.
          d0 = s.index('<!-- ===== 04; PARTE II — DICIONÁRIO DE EQUIVALÊNCIAS ===== -->')
          d1 = s.index('<!-- ===== 05; METODOLOGIA ===== -->', d0)
          dictionary = s[d0:d1]

          def remove_label(text, label, expected=46):
              marker = f'<div><p class="verb__lbl">{label}</p>'
              assert text.count(marker) == expected, (label, text.count(marker))
              cuts = []
              pos = 0
              while True:
                  i = text.find(marker, pos)
                  if i < 0:
                      break
                  a = text.rfind('\n', 0, i) + 1
                  assert not text[a:i].strip()
                  b = text.find('</div>', i)
                  assert b >= 0
                  b += len('</div>')
                  if text[b:b+1] == '\n':
                      b += 1
                  cuts.append((a, b))
                  pos = b
              assert len(cuts) == expected, (label, len(cuts))
              for a, b in reversed(cuts):
                  text = text[:a] + text[b:]
              return text

          dictionary = remove_label(dictionary, 'Definição')
          dictionary = remove_label(dictionary, 'O que isso resolve no privado')
          s = s[:d0] + dictionary + s[d1:]

          # 5) Shared seal treatment; remove now-dead duplicate eqhead typography.
          assert '.mecdom__c' not in before and '.grp__c' not in before
          anchor = re.search(r'(?ms)^\.mec__c\{\n.*?^\}\n', s)
          assert anchor
          seal_css = (
              '.mecdom__c,\n'
              '.grp__c{\n'
              '  display:inline-block; margin-right:.35rem;\n'
              '  font-family:var(--f-micro); font-size:.68rem; letter-spacing:.06em;\n'
              '  color:var(--ink-62); font-variant-numeric:tabular-nums;\n'
              '}\n'
          )
          s = s[:anchor.end()] + seal_css + s[anchor.end():]
          s, n = re.subn(
              r'(?ms)^\.eqhead__k\{\n  font-family:var\(--f-micro\);.*?^\}\n',
              '',
              s,
          )
          assert n == 1, n
          assert s.count('.eqhead__k{ display:none; }') == 1

          # Postconditions.
          assert s.count('<details class="mec" id=') == 17
          assert s.count('<details class="verb" id=') == 46
          assert s.count('<details class="grp" data-reveal="">') == 5
          assert s.count('<header class="mecdom">') == 5
          assert s.count('class="mecdom__c"') == 5
          assert s.count('class="grp__c"') == 5
          assert not re.search(r'<span class="eqhead__k">(?:02|03|04|05)</span>', s)
          assert s.count('<p class="verb__lbl">Definição</p>') == 0
          assert s.count('<p class="verb__lbl">O que isso resolve no privado</p>') == 0
          assert s.count('<p class="verb__lbl">Demonstrada por</p>') == 46
          assert s.count('<p class="verb__lbl">Também chamado de</p>') == 46
          assert s.count('<p class="verb__lbl">Referência normativa</p>') == 1
          assert 'Arquitetura alinhada à LGPD e à Resolução CNJ 615/2025.' in s
          assert s.count('<p class="verb__lbl">Ressalva de escopo</p>') == 1
          assert 'A equivalência possui cobertura parcial e declarada.' in s
          assert 'As entradas seguintes não ampliam o número de entregas.' not in s
          assert not re.search(r'<header class="mecdom"><h4>0[1-5];', s)
          assert not re.search(r'<summary><h4>[A-E];', s)

          # Contracts explicitly requested to remain untouched.
          assert detail_blocks(s, 'mec') == mecs_before
          assert re.findall(r'<script\b[^>]*>.*?</script>', s, re.S) == scripts_before
          for key, old in attrs_before.items():
              now = re.findall(r'style="--i:[^"]+"', s) if key == 'style-i' else re.findall(r'\b' + re.escape(key) + r'="[^"]*"', s)
              assert now == old, key
          assert re.findall(r'<button class="chip"\b[^>]*>', s) == chips_before

          p.write_text(s, encoding='utf-8')
          print('ARCO repertorio patch validated')
          PY

          git diff --check -- arco.html

      - name: Commit patch and remove temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- arco.html
          git rm -- .github/workflows/arco-repertorio-once.yml .github/workflows/arco-repertorio-issue-once.yml
          git diff --cached --check
          git commit -m "refactor(arco): enxuga dicionário e unifica numeração"
          git push origin HEAD:main
