name: Refine ARCO repertorio once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arco-repertorio-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate arco.html
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object arco.html)" = "9acff5d407491983bac56a1914316b1c65010629"

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('arco.html')
          before = p.read_text(encoding='utf-8')
          s = before

          # Structural baselines.
          assert before.count('<details class="mec" id=') == 17
          assert before.count('<details class="verb" id=') == 46
          assert before.count('<details class="grp" data-reveal="">') == 5
          assert before.count('<header class="mecdom">') == 5
          assert before.count('<p class="verb__lbl">Definição</p>') == 46
          assert before.count('<p class="verb__lbl">O que isso resolve no privado</p>') == 46
          assert before.count('<p class="verb__lbl">Demonstrada por</p>') == 46
          assert before.count('<p class="verb__lbl">Também chamado de</p>') == 46
          assert before.count('<p class="verb__lbl">Referência normativa</p>') == 1
          assert before.count('<p class="verb__lbl">Ressalva de escopo</p>') == 1

          def detail_blocks(text, klass):
              starts = list(re.finditer(r'<details class="' + re.escape(klass) + r'"\b[^>]*>', text))
              out = []
              token = re.compile(r'<details\b[^>]*>|</details>')
              for st in starts:
                  depth = 0
                  end = None
                  for m in token.finditer(text, st.start()):
                      if m.group(0).startswith('<details'):
                          depth += 1
                      else:
                          depth -= 1
                          if depth == 0:
                              end = m.end()
                              break
                  assert end is not None, (klass, st.start())
                  out.append(text[st.start():end])
              return out

          mec_before = detail_blocks(before, 'mec')
          assert len(mec_before) == 17
          scripts_before = re.findall(r'<script\b[^>]*>.*?</script>', before, re.S)

          preserved_attrs = {}
          for attr in ('id', 'data-goto', 'data-anchor', 'data-label', 'data-reveal'):
              preserved_attrs[attr] = re.findall(r'\b' + re.escape(attr) + r'="[^"]*"', before)
          preserved_attrs['style-i'] = re.findall(r'style="--i:[^"]+"', before)
          chips_before = re.findall(r'<button class="chip"\b[^>]*>', before)

          # Section-level numbering: remove visual 02/03/04/05 labels only.
          s, n_eq = re.subn(
              r'(?m)^[ \t]*<span class="eqhead__k">(02|03|04|05)</span>\n',
              '', s
          )
          assert n_eq == 4, n_eq

          # Domain numbering: Arabic seal.
          s, n_dom = re.subn(
              r'<header class="mecdom"><h4>(0[1-5]); ([^<]+)</h4>',
              lambda m: '<header class="mecdom"><h4><span class="mecdom__c">' + m.group(1) + '</span> ' + m.group(2) + '</h4>',
              s
          )
          assert n_dom == 5, n_dom

          # Dictionary group numbering: alpha seal.
          s, n_grp = re.subn(
              r'<summary><h4>([A-E]); ([^<]+)</h4><span class="grp__n">',
              lambda m: '<summary><h4><span class="grp__c">' + m.group(1) + '</span> ' + m.group(2) + '</h4><span class="grp__n">',
              s
          )
          assert n_grp == 5, n_grp

          # Dictionary intro: remove the now-redundant sentence only.
          old_intro = (
              '            As entradas seguintes não ampliam o número de entregas. Traduzem os mecanismos\n'
              '            implementados para categorias reconhecíveis pelo mercado privado.\n'
          )
          new_intro = '            Traduzem os mecanismos implementados para categorias reconhecíveis pelo mercado privado.\n'
          assert s.count(old_intro) == 1
          s = s.replace(old_intro, new_intro, 1)

          # Dictionary only: remove exactly the two prose blocks requested.
          d0 = s.index('<!-- ===== 04; PARTE II — DICIONÁRIO DE EQUIVALÊNCIAS ===== -->')
          d1 = s.index('<!-- ===== 05; METODOLOGIA ===== -->', d0)
          dictionary = s[d0:d1]

          def remove_labeled_blocks(text, label, expected):
              marker = f'<div><p class="verb__lbl">{label}</p>'
              assert text.count(marker) == expected, (label, text.count(marker))
              positions = []
              pos = 0
              while True:
                  i = text.find(marker, pos)
                  if i < 0:
                      break
                  line_start = text.rfind('\n', 0, i) + 1
                  assert text[line_start:i].strip() == '', (label, text[line_start:i])
                  end = text.find('</div>', i)
                  assert end >= 0, label
                  end += len('</div>')
                  if text[end:end+1] == '\n':
                      end += 1
                  positions.append((line_start, end))
                  pos = end
              assert len(positions) == expected, (label, len(positions))
              for a, b in reversed(positions):
                  text = text[:a] + text[b:]
              return text

          dictionary = remove_labeled_blocks(dictionary, 'Definição', 46)
          dictionary = remove_labeled_blocks(dictionary, 'O que isso resolve no privado', 46)
          s = s[:d0] + dictionary + s[d1:]

          # Number seals: same micro-typographic language as .mec__c, inline in headings.
          assert '.mecdom__c' not in before and '.grp__c' not in before
          mec_code = re.search(r'(?ms)^\.mec__c\{\n.*?^\}\n', s)
          assert mec_code
          seal_css = (
              '.mecdom__c,\n'
              '.grp__c{\n'
              '  display:inline-block; margin-right:.35rem;\n'
              '  font-family:var(--f-micro); font-size:.68rem; letter-spacing:.06em;\n'
              '  color:var(--ink-62); font-variant-numeric:tabular-nums;\n'
              '}\n'
          )
          insert_at = mec_code.end()
          s = s[:insert_at] + seal_css + s[insert_at:]

          # .eqhead__k no longer renders: keep the defensive display:none rule,
          # remove the duplicate typography declaration that has become dead CSS.
          s, n_dead = re.subn(
              r'(?ms)^\.eqhead__k\{\n  font-family:var\(--f-micro\);.*?^\}\n',
              '', s
          )
          assert n_dead == 1, n_dead
          assert s.count('.eqhead__k{ display:none; }') == 1

          # Postconditions.
          assert s.count('<details class="mec" id=') == 17
          assert s.count('<details class="verb" id=') == 46
          assert s.count('<details class="grp" data-reveal="">') == 5
          assert s.count('<header class="mecdom">') == 5
          assert s.count('class="mecdom__c"') == 5
          assert s.count('class="grp__c"') == 5
          assert not re.search(r'<span class="eqhead__k">(?:02|03|04|05)</span>', s)
          assert s.count('<p class="verb__lbl">Definição</p>') == 0
          assert s.count('<p class="verb__lbl">O que isso resolve no privado</p>') == 0
          assert s.count('<p class="verb__lbl">Demonstrada por</p>') == 46
          assert s.count('<p class="verb__lbl">Também chamado de</p>') == 46
          assert s.count('<p class="verb__lbl">Referência normativa</p>') == 1
          assert s.count('Arquitetura alinhada à LGPD e à Resolução CNJ 615/2025.') == 1
          assert s.count('<p class="verb__lbl">Ressalva de escopo</p>') == 1
          assert 'A equivalência possui cobertura parcial e declarada.' in s
          assert 'As entradas seguintes não ampliam o número de entregas.' not in s

          # Mechanisms and JS must remain byte-identical.
          mec_after = detail_blocks(s, 'mec')
          assert mec_after == mec_before
          scripts_after = re.findall(r'<script\b[^>]*>.*?</script>', s, re.S)
          assert scripts_after == scripts_before

          # Navigation contracts and chip markup must remain byte-identical.
          for attr, baseline in preserved_attrs.items():
              if attr == 'style-i':
                  now = re.findall(r'style="--i:[^"]+"', s)
              else:
                  now = re.findall(r'\b' + re.escape(attr) + r'="[^"]*"', s)
              assert now == baseline, attr
          assert re.findall(r'<button class="chip"\b[^>]*>', s) == chips_before

          # No visible semicolon-prefix remains in domain/group headings.
          assert not re.search(r'<header class="mecdom"><h4>0[1-5];', s)
          assert not re.search(r'<summary><h4>[A-E];', s)

          p.write_text(s, encoding='utf-8')

          # Export all inline JS blocks for syntax checking without modifying them.
          scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', s, re.S)
          for i, body in enumerate(scripts):
              Path(f'/tmp/arco-script-{i}.js').write_text(body, encoding='utf-8')

          print('validated:', {
              'mechanisms': 17,
              'dictionary_entries': 46,
              'removed_definitions': 46,
              'removed_private_prose': 46,
              'domain_seals': 5,
              'group_seals': 5,
              'section_numbers_removed': 4,
              'scripts_unchanged': len(scripts),
          })
          PY

          for f in /tmp/arco-script-*.js; do node --check "$f"; done
          git diff --check -- arco.html
          git diff --exit-code --quiet -- . ':(exclude)arco.html'
          git diff --stat -- arco.html
          git diff -- arco.html

      - name: Commit arco.html to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- arco.html
          git diff --cached --quiet && exit 0
          git commit -m "refactor(arco): enxuga dicionário e unifica numeração"
          git push origin HEAD:main
