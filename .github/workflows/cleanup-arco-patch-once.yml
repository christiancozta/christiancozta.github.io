name: Cleanup Arco patch artifacts once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-arco-patch-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary patch artifacts
        shell: bash
        run: |
          git rm -f \
            .github/hero-trigger-v2.txt \
            .github/hero-trigger-v2-issue-note.txt \
            .github/hero-trigger-v2-ready.txt \
            .github/hero-trigger-v2-final-note.txt \
            .github/hero-trigger-v2-stop.txt \
            .github/hero-trigger-v2-cleanup-note.txt \
            .github/workflows/arco-hero-issue-once.yml \
            .github/workflows/cleanup-arco-patch-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: clean temporary Arco patch artifacts"
          git push origin HEAD:main
