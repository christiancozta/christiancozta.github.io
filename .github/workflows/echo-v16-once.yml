name: Publish ECHO opening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/echo-v16-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate and validate echo.html
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_CSS: 87500fd2a4308a0eb0fdb0edf8d563ab4615daca
          BLOB_OPENING: 30bf0d1a1e99eba7b76505beb1a69603ef1749d7
          BLOB_LIFECYCLE: 52657e3ed464b52f11a5c1b834fdb90579be6856
          BLOB_RETURN: 962543cd2d37dcda31eded289e334771d163c7e9
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json, os, re, urllib.request

          def blob(sha):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as r:
                  data = json.load(r)
              return base64.b64decode(data["content"]).decode("utf-8")

          css = blob(os.environ["BLOB_CSS"])
          opening = blob(os.environ["BLOB_OPENING"])
          lifecycle = blob(os.environ["BLOB_LIFECYCLE"])
          render_return = blob(os.environ["BLOB_RETURN"])

          p = Path("echo.html")
          s = p.read_text(encoding="utf-8")

          guards = [
              '<script src="./support.js?v=20260807-1"></script>',
              '<header id="top" class="echo-hero">',
              '<section id="preliminares"',
              '/* partitura do acervo:',
              '<sc-if value="{{ notaAberta }}" hint-placeholder-val="{{ false }}">',
              'componentDidUpdate() { this._sweep(); }',
          ]
          for guard in guards:
              assert guard in s, guard

          old_fonts = 'family=Azeret+Mono:wght@400;500&family=Commissioner:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700&display=swap'
          new_fonts = 'family=Azeret+Mono:wght@400;500&family=Commissioner:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700&family=Zalando+Sans+Expanded:wght@700&display=swap'
          assert s.count(old_fonts) == 1
          s = s.replace(old_fonts, new_fonts, 1)

          old_body = 'body{margin:0;background:#F2EFE9;'
          assert s.count(old_body) == 1
          s = s.replace(old_body, 'body{margin:0;overflow-x:clip;background:#F2EFE9;', 1)

          css_start = s.index('/* ==========================================================================\n   HERO — campo de eco / proposta consolidada.')
          css_end = s.index('/* cadeia operacional:', css_start)
          s = s[:css_start] + css + s[css_end:]

          part_start = s.index('/* partitura do acervo:')
          part_end = s.index('/* Achados — escala de vernier:', part_start)
          s = s[:part_start] + s[part_end:]

          hero_start = s.index('<header id="top" class="echo-hero">')
          prelim_start = s.index('<section id="preliminares"', hero_start)
          s = s[:hero_start] + opening + s[prelim_start:]

          note_start = s.rfind('\n<sc-if value="{{ notaAberta }}" hint-placeholder-val="{{ false }}">')
          assert note_start != -1
          note_marker = '</sc-if>\n</x-dc>'
          note_end = s.index(note_marker, note_start)
          s = s[:note_start] + '\n</x-dc>' + s[note_end + len(note_marker):]

          life_start = s.index('  componentDidMount() {')
          life_end = s.index('  _show(el) {', life_start)
          s = s[:life_start] + lifecycle + s[life_end:]

          old_return = "    return {\n      materiais, percursos, ficha,\n      notaAberta: this.state.nota,\n      abrirNota: () => this.setState((st) => ({ nota: !st.nota })),\n      fecharNota: () => this.setState({ nota: false })\n    };\n"
          assert s.count(old_return) == 1
          s = s.replace(old_return, render_return, 1)

          required = [
              "top", "legal-ops-trigger", "legal-ops-note", "legal-ops-close",
              "visao-geral", "preliminares", "acervo", "achados", "autoria"
          ]
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', s)
          for rid in required:
              assert ids.count(rid) == 1, (rid, ids.count(rid))
          assert len(ids) == len(set(ids)), "duplicate ids"
          assert all(x not in s for x in ["echo-plot", "echo-lede", "partitura", "echo-families"])
          assert "Zalando Sans Expanded" in s
          assert "top:36%" in s
          assert "background:#F5F5F5" in s
          assert '<section id="preliminares"' in s
          assert '<section id="acervo"' in s
          assert '<section id="achados"' in s
          assert '<section id="autoria"' in s

          p.write_text(s, encoding="utf-8")

          m = re.search(r'<script type="text/x-dc"[^>]*>(.*?)</script>', s, re.S)
          assert m, "DC script missing"
          Path("/tmp/echo-dc.js").write_text(m.group(1), encoding="utf-8")
          PY

          node --check /tmp/echo-dc.js
          git diff --check -- echo.html

      - name: Commit echo.html to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add echo.html
          git diff --cached --quiet && exit 0
          git commit -m "feat(echo): publish new hero subhero and Legal Ops pill"
          git push origin HEAD:main
