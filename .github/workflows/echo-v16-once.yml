name: Apply ARCO territorial hover patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/echo-v16-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate arco.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("arco.html")
          s = p.read_text(encoding="utf-8")

          anchor = '''.rail__link[data-view="atrio"][aria-current="true"]::after{ background:var(--atrio); }
'''
          addition = '''
.rail__link[data-view="echo"]:hover,
.rail__link[data-view="echo"]:hover .n{
  color:var(--echo);
}
.rail__link[data-view="echo"]:hover::after{
  background:var(--echo);
}

.rail__link[data-view="atrio"]:hover,
.rail__link[data-view="atrio"]:hover .n{
  color:var(--atrio);
}
.rail__link[data-view="atrio"]:hover::after{
  background:var(--atrio);
}
'''

          assert s.count(anchor) == 1, "ATRIO territorial anchor changed"
          assert addition not in s, "hover patch already present"
          s = s.replace(anchor, anchor + addition, 1)

          assert s.count('.rail__link[data-view="echo"]:hover') == 3
          assert s.count('.rail__link[data-view="atrio"]:hover') == 3
          assert '.rail__link:hover::after{ width:1.75rem; }' in s
          assert '.rail__link[data-view="echo"][aria-current="true"]::after{ background:var(--echo); }' in s
          assert '.rail__link[data-view="atrio"][aria-current="true"]::after{ background:var(--atrio); }' in s

          p.write_text(s, encoding="utf-8")
          PY

          git diff --check -- arco.html

      - name: Restore one-time workflow and commit only the intended final change
        shell: bash
        run: |
          git show 07423ae44b1c5bb94a850e13deb957f1ee2002ea > .github/workflows/echo-v16-once.yml
          git diff --check -- arco.html .github/workflows/echo-v16-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html .github/workflows/echo-v16-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(arco): add territorial hover states to menu"
          git push origin HEAD:main
