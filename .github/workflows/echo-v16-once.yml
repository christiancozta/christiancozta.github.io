name: Apply ARCO territorial hover patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/echo-v16-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch and validate arco.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("arco.html")
          s = p.read_text(encoding="utf-8")

          anchor = '.rail__link[data-view="atrio"][aria-current="true"]::after{ background:var(--atrio); }\n'
          addition = ''.join([
              '\n',
              '.rail__link[data-view="echo"]:hover,\n',
              '.rail__link[data-view="echo"]:hover .n{\n',
              '  color:var(--echo);\n',
              '}\n',
              '.rail__link[data-view="echo"]:hover::after{\n',
              '  background:var(--echo);\n',
              '}\n',
              '\n',
              '.rail__link[data-view="atrio"]:hover,\n',
              '.rail__link[data-view="atrio"]:hover .n{\n',
              '  color:var(--atrio);\n',
              '}\n',
              '.rail__link[data-view="atrio"]:hover::after{\n',
              '  background:var(--atrio);\n',
              '}\n',
          ])

          assert s.count(anchor) == 1, "ATRIO territorial anchor changed"
          assert addition not in s, "hover patch already present"
          s = s.replace(anchor, anchor + addition, 1)

          assert s.count('.rail__link[data-view="echo"]:hover') == 3
          assert s.count('.rail__link[data-view="atrio"]:hover') == 3
          assert '.rail__link:hover::after{ width:1.75rem; }' in s
          assert '.rail__link[data-view="echo"][aria-current="true"]::after{ background:var(--echo); }' in s
          assert '.rail__link[data-view="atrio"][aria-current="true"]::after{ background:var(--atrio); }' in s

          p.write_text(s, encoding="utf-8")
          PY

          git diff --check -- arco.html

      - name: Commit only arco.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(arco): add territorial hover states to menu"
          git push origin HEAD:main
