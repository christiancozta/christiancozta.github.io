name: Finalize DATA privacy correction

on:
  push:
    paths:
      - '.github/workflows/finalize-data-privacy.yml'
      - 'tools/finalize_data_privacy.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply conservative DATA correction and audit
        run: python tools/finalize_data_privacy.py

      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Correct DATA public evidence exposure"
          git push origin HEAD:main
