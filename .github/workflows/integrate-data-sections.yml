name: Integrate DATA rail sections

on:
  push:
    paths:
      - '.github/data-stage6-10-trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply stages 6-10
        run: python3 .github/scripts/integrate_data_sections.py

      - name: Guard DATA internals
        shell: bash
        run: |
          git diff --quiet -- data.html data.css data.js || {
            echo "DATA internals changed unexpectedly"
            git diff -- data.html data.css data.js
            exit 1
          }

      - name: Validate integration contracts
        shell: bash
        run: |
          grep -q 'data-sec="data"' arco.html
          grep -q 'data-child="data" data-target="rastro"' arco.html
          grep -q 'data-child="data" data-target="lastro"' arco.html
          grep -q "querySelectorAll('.rail__sec\[data-sec\]')" assets/arco/js/arco.js
          ! grep -q 'DATA_SECTION' assets/arco/js/arco.js

      - name: Commit stages 6-10
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html assets/arco/js/arco.js assets/arco/css/fonts.css
          git commit -m "Integrate DATA rail sections and tracking"
          git push origin main
