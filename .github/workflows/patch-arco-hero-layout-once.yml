name: Patch Arco hero layout once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-arco-hero-layout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Arco hero spacing and bio alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('arco.html')
          s = p.read_text(encoding='utf-8')

          edits = [
              (
                  '.bio{ max-width:min(50ch, 66%); margin:0 0 clamp(1.5rem,3vw,2.4rem); }',
                  '.bio{ max-width:66%; margin:0 0 clamp(1.5rem,3vw,2.4rem); }'
              ),
              (
                  '  text-align:justify;\n}\n.bio__run .mov__t{ display:inline; }',
                  '  text-align:left;\n}\n.bio__run .mov__t{ display:inline; }'
              ),
              (
                  '/* O novo percurso equivale a 8 linhas: duas pausas de meia linha.\n   No desktop, o bloco cresce para cima e preserva o respiro diante do arco. */',
                  '/* O novo percurso equivale a 8 linhas: duas pausas de meia linha. */'
              ),
              (
                  '\n@media (min-width:821px){\n  .hero__txt{\n    position:relative;\n    top:-2.8rem;\n  }\n}\n',
                  '\n'
              ),
          ]

          for old, new in edits:
              count = s.count(old)
              assert count == 1, f'expected one target, found {count}: {old[:90]!r}'
              s = s.replace(old, new, 1)

          assert '.bio{ max-width:66%;' in s
          assert '.bio{ max-width:min(50ch, 66%);' not in s
          assert 'top:-2.8rem' not in s
          bio_start = s.index('.bio__run{')
          bio_end = s.index('.bio__run .mov__t', bio_start)
          assert 'text-align:left;' in s[bio_start:bio_end]
          assert 'text-align:justify;' not in s[bio_start:bio_end]

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check -- arco.html

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html
          git rm .github/workflows/patch-arco-hero-layout-once.yml
          git diff --cached --check
          git commit -m "fix(arco): rebalance hero bio and percurso spacing"
          git push origin HEAD:main
