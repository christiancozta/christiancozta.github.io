name: Patch rail active context v2

on:
  push:
    branches:
      - fix/rail-active-context-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rail-active-context-v2
          fetch-depth: 0

      - name: Apply and verify correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('arco.html')
          s = p.read_text(encoding='utf-8')

          css = '''/* Estado territorial: o acento existe somente enquanto a página-mãe está em campo. */
          .rail__link[data-view="echo"][aria-current="true"],
          .rail__link[data-view="echo"][aria-current="true"] .n{
            color:var(--echo);
          }
          .rail__link[data-view="echo"][aria-current="true"]::after{ background:var(--echo); }

          .rail__link[data-view="atrio"][aria-current="true"],
          .rail__link[data-view="atrio"][aria-current="true"] .n{
            color:var(--atrio);
          }
          .rail__link[data-view="atrio"][aria-current="true"]::after{ background:var(--atrio); }

          /* Nos filhos, cor é estado: somente a subseção corrente recebe o acento. */
          .rail__seclink[data-child="echo"][aria-current="location"]{ color:var(--echo); }
          .rail__seclink[data-child="atrio"][aria-current="location"]{ color:var(--atrio); }

          '''
          s, n = re.subn(
              r'/\* Hover territorial \*/.*?(?=/\* o pé da coluna:)',
              css,
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, f'CSS block: {n}'

          s, n = re.subn(
              r'    if \(persist && target\)\{\n\s*try \{ sessionStorage\.setItem\(childKey\(view\), target\); \} catch \{\}\n\s*\}',
              '''    if (persist){
              try {
                if (target) sessionStorage.setItem(childKey(view), target);
                else sessionStorage.removeItem(childKey(view));
              } catch {}
            }''',
              s,
              count=1,
          )
          assert n == 1, f'persist block: {n}'

          s, n = re.subn(
              r'      let active = sections\[0\];\n      for \(const section of sections\)\{\n        if \(section\.node\.getBoundingClientRect\(\)\.top <= marker\) active = section;\n        else break;\n      \}\n      setChildActive\(view, active\.id\);',
              '''      let active = null;
              for (const section of sections){
                if (section.node.getBoundingClientRect().top <= marker) active = section;
                else break;
              }
              setChildActive(view, active ? active.id : "");''',
              s,
              count=1,
          )
          assert n == 1, f'tracking block: {n}'

          required = [
              '.rail__link[data-view="echo"][aria-current="true"]',
              '.rail__link[data-view="atrio"][aria-current="true"]',
              'let active = null;',
              'setChildActive(view, active ? active.id : "");',
              'sessionStorage.removeItem(childKey(view));',
          ]
          assert all(x in s for x in required)
          assert 'let active = sections[0];' not in s
          assert 'Territórios permanentes' not in s
          assert 'Hover territorial' not in s

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-rail-active-context-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arco.html .github/workflows/patch-rail-active-context-v2.yml
          git commit -m "fix: corrige estado contextual de echo e ATRIO"
          git push origin fix/rail-active-context-v2
