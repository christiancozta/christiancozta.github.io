name: Actions smoke test once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-action-smoke-once.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark successful trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'ok\n' > .github/action-smoke.txt
          git add .github/action-smoke.txt
          git commit -m "chore: confirm Actions trigger"
          git push origin HEAD:main
