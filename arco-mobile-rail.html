<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arco — mobile arrow | Christian da Costa</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;min-height:100%;background:#fff;color:#181818}
.arco-variant-loader{min-height:100dvh;display:grid;place-items:center;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;color:rgba(24,24,24,.62)}
</style>
</head>
<body>
<div class="arco-variant-loader" role="status">Carregando variante mobile…</div>
<script>
(() => {
  'use strict';

  const CSS = String.raw`
/* ========================================================================== 
   VARIANTE EXPERIMENTAL — MOBILE ARROW
   A spring do arco vira o início de uma única flecha vertical. O eixo permanece
   no x físico do pé esquerdo do SVG; dele derivam métricas e títulos.
   ========================================================================== */
@media (max-width:820px){
  .home{
    --mobile-arrow-x:var(--pad);
    --mobile-arrow-top:0px;
    --mobile-arrow-h:0px;
    --mobile-arrow-draw:1800ms;
    --metric-shift:clamp(1.25rem,6vw,1.6rem);
    --title-shift:clamp(1.25rem,6vw,1.6rem);
  }

  /* No celular o hero deixa de preencher artificialmente uma viewport inteira.
     O percurso fica mais compacto e o arco sobe, abrindo espaço para métricas
     com quebra natural em duas linhas. */
  .narr-zone{
    min-height:auto !important;
    padding-top:clamp(1.45rem,4.2vw,2rem);
  }
  .hero__txt,
  .narr-zone .arc{
    margin-top:0 !important;
  }
  .bio{
    max-width:none;
    margin:0 0 clamp(.9rem,2.6vw,1.2rem);
  }
  .hero__txt{
    margin-top:clamp(1.25rem,3.8vw,1.7rem) !important;
  }
  .narr-zone .arc{
    margin-top:clamp(.9rem,3vw,1.3rem) !important;
  }
  .narr{
    position:static;
    order:9;
    opacity:1;
    pointer-events:auto;
    width:100%; max-width:100%; min-width:0;
    margin-top:clamp(.55rem,2.4vw,.85rem);
  }

  /* EIXO ÚNICO — o centro do filete coincide com o x=0 da spring. */
  .home::after{
    content:"";
    position:absolute;
    pointer-events:none;
    z-index:0;
    left:calc(var(--mobile-arrow-x) - .5px);
    top:calc(var(--mobile-arrow-top) - .5px);
    width:1px;
    height:var(--mobile-arrow-h);
    background:var(--hair);
    transform:scaleY(0);
    transform-origin:50% 0;
    will-change:transform;
  }
  .home.mobile-arrow-ready.mobile-arrow-on::after{
    transform:scaleY(1);
    transition:transform var(--mobile-arrow-draw) linear;
  }

  /* MÉTRICAS — o border-left antigo sai. Cada número recebe um ramal da mesma
     flecha; a legenda pode ocupar uma ou duas linhas sem alterar o ponto de
     referência, que continua sendo o centro óptico do número. */
  .narr__svg{ display:none; }
  .narr__stats{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:clamp(.28rem,1.4vw,.42rem);
    padding-left:0;
    border-left:0;
  }
  .narr__stat{
    position:static;
    width:auto; max-width:none;
    display:grid;
    grid-template-columns:clamp(7rem,29vw,8.4rem) minmax(0,1fr);
    align-items:start;
    column-gap:clamp(.55rem,2.4vw,.8rem);
    opacity:1;
    transform:none;
  }
  .home.mobile-arrow-ready .narr__stat{
    opacity:0;
    transform:translateY(4px);
  }
  .narr__n{
    position:relative;
    display:block;
    min-width:0;
    padding-left:var(--metric-shift);
  }
  .narr__n::before{
    content:"";
    position:absolute;
    pointer-events:none;
    left:0;
    top:calc(50% - .5px);
    width:calc(var(--metric-shift) - .38rem);
    height:1px;
    background:var(--hair);
    transform:scaleX(0);
    transform-origin:0 50%;
    will-change:transform;
  }
  .narr__l{
    min-width:0;
    line-height:1.46;
  }
  .home.mobile-arrow-ready.mobile-arrow-on .narr__n::before{
    transform:scaleX(1);
    transition:transform 280ms var(--ease) var(--arrow-delay,0ms);
  }
  .home.mobile-arrow-ready.mobile-arrow-on .narr__stat{
    opacity:1;
    transform:none;
    transition:opacity 330ms var(--ease), transform 330ms var(--ease);
    transition-delay:calc(var(--arrow-delay,0ms) + 65ms);
  }

  /* ARCADA — os três pilares desktop são removidos. No mobile a flecha única
     continua descendo pelo limite esquerdo do conteúdo e deriva só para os
     títulos. 01/02/03 somem. A prosa conserva exatamente o alinhamento original. */
  .arcade{
    position:relative;
    grid-template-columns:1fr;
    row-gap:clamp(1.05rem,3.6vw,1.45rem);
    margin-top:clamp(.95rem,3.4vw,1.35rem);
  }
  .arcade .mov{
    border-top:0;
    padding-top:0;
  }
  .arcade .mov::before{
    content:none !important;
    display:none !important;
  }
  .arcade .mov__n{
    display:none !important;
  }
  .arcade .mov__h{
    position:relative;
    z-index:1;
    padding-left:var(--title-shift);
    margin:.1rem 0 .65rem;
  }
  .arcade .mov__h::before{
    content:"";
    position:absolute;
    pointer-events:none;
    left:0;
    top:calc(50% - .5px);
    width:calc(var(--title-shift) - .35rem);
    height:1px;
    background:var(--hair);
    transform:scaleX(0);
    transform-origin:0 50%;
    will-change:transform;
  }
  .home.mobile-arrow-ready.mobile-arrow-on .arcade .mov__h::before{
    transform:scaleX(1);
    transition:transform 300ms var(--ease) var(--arrow-delay,0ms);
  }
}

@media (max-width:820px) and (prefers-reduced-motion:reduce){
  .home::after,
  .narr__n::before,
  .arcade .mov__h::before{
    transform:none !important;
    transition:none !important;
  }
  .home.mobile-arrow-ready .narr__stat{
    opacity:1 !important;
    transform:none !important;
    transition:none !important;
  }
}
`;

  const JS = String.raw`
(() => {
  'use strict';

  const mq = matchMedia('(max-width:820px)');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const home = document.querySelector('.view[data-view="home"] .home');
  if (!home) return;

  const arc = home.querySelector('.narr-zone .arc');
  const metricNumbers = [...home.querySelectorAll('.narr__stat .narr__n')];
  const titles = [...home.querySelectorAll('.arcade > .mov > .mov__h')];
  const lastTitle = titles[titles.length - 1];
  if (!arc || metricNumbers.length !== 5 || titles.length !== 3 || !lastTitle) return;

  let started = false;

  function measureArrow(){
    if (!mq.matches) return;

    const hr = home.getBoundingClientRect();
    const ar = arc.getBoundingClientRect();
    const lr = lastTitle.getBoundingClientRect();
    if (!hr.width || !ar.width || !lr.width) return;

    /* spring: x=0 e y=altura do próprio SVG. O eixo CSS usa exatamente esses
       dois pontos físicos como origem, sem migrar para uma calha externa. */
    const x = ar.left - hr.left;
    const top = ar.bottom - hr.top;
    const end = lr.top + lr.height / 2 - hr.top;
    const height = Math.max(1, end - top);

    /* duração cresce moderadamente com a extensão real, sem ficar lenta demais. */
    const draw = Math.round(Math.min(2300, Math.max(1450, height * 1.65)));

    home.style.setProperty('--mobile-arrow-x', x.toFixed(2) + 'px');
    home.style.setProperty('--mobile-arrow-top', top.toFixed(2) + 'px');
    home.style.setProperty('--mobile-arrow-h', height.toFixed(2) + 'px');
    home.style.setProperty('--mobile-arrow-draw', draw + 'ms');

    [...metricNumbers, ...titles].forEach(node => {
      const r = node.getBoundingClientRect();
      const y = r.top + r.height / 2 - hr.top;
      const ratio = Math.min(1, Math.max(0, (y - top) / height));
      const delay = Math.round(ratio * draw) + 'ms';
      node.style.setProperty('--arrow-delay', delay);
      /* o delay também pertence ao li, porque é ele que faz o fade do conjunto */
      node.closest('.narr__stat')?.style.setProperty('--arrow-delay', delay);
    });
  }

  function activate(){
    if (started) return;
    started = true;
    if (!mq.matches) return;
    measureArrow();
    home.classList.add('mobile-arrow-on');
  }

  function sync(){
    if (!mq.matches) return;
    measureArrow();
    home.classList.add('mobile-arrow-ready');
    if (reduce){
      started = true;
      home.classList.add('mobile-arrow-on');
    } else if (started){
      home.classList.add('mobile-arrow-on');
    }
  }

  const EVENTS = ['scroll','wheel','pointerdown','keydown','touchstart'];
  EVENTS.forEach(type => addEventListener(type, activate, {passive:true, once:true}));

  mq.addEventListener?.('change', sync);
  addEventListener('resize', measureArrow, {passive:true});
  addEventListener('orientationchange', measureArrow, {passive:true});
  document.fonts?.ready.then(() => requestAnimationFrame(sync));

  if (typeof ResizeObserver === 'function'){
    const ro = new ResizeObserver(() => requestAnimationFrame(measureArrow));
    ro.observe(home);
    ro.observe(arc);
    ro.observe(lastTitle);
  }

  requestAnimationFrame(sync);
})();
`;

  fetch('arco.html', {cache:'no-store'})
    .then(response => {
      if (!response.ok) throw new Error('arco.html: HTTP ' + response.status);
      return response.text();
    })
    .then(source => {
      source = source.replace('<title>Arco | Christian da Costa</title>', '<title>Arco — mobile arrow | Christian da Costa</title>');
      source = source.replace('</head>', '<meta name="robots" content="noindex,nofollow"><style id="mobile-arrow-variant">' + CSS + '</style></head>');
      source = source.replace('</body>', '<script id="mobile-arrow-variant-js">' + JS + '</scr' + 'ipt></body>');
      document.open();
      document.write(source);
      document.close();
    })
    .catch(error => {
      document.body.innerHTML = '<pre style="padding:24px;font:12px/1.5 monospace;white-space:pre-wrap">Falha ao carregar a variante mobile.\n' +
        String(error && error.message || error).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>';
    });
})();
</script>
</body>
</html>
