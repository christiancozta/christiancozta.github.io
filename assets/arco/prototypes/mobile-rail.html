<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arco — mobile arrow | Christian da Costa</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;min-height:100%;background:#fff;color:#181818}
.arco-variant-loader{min-height:100dvh;display:grid;place-items:center;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;color:rgba(24,24,24,.62)}
</style>
</head>
<body>
<div class="arco-variant-loader" role="status">Carregando variante mobile…</div>
<script>
(() => {
  'use strict';

  const CSS = String.raw`
/* ========================================================================== 
   VARIANTE EXPERIMENTAL — MOBILE ARROW
   A spring do arco vira o início de uma única flecha vertical. O eixo permanece
   no x físico do pé esquerdo do SVG; dele derivam métricas e títulos.
   ========================================================================== */
@media (max-width:820px){
  .home{
    position:relative;
    --mobile-arrow-x:var(--pad);
    --mobile-arrow-top:0px;
    --mobile-arrow-h:0px;
    --title-shift:clamp(1.25rem,6vw,1.6rem);
    --body-gutter:clamp(.72rem,3vw,.95rem);
    --metric-shift:calc(var(--body-gutter) + var(--title-shift));
    --branch-gap:.45rem;
  }

  .narr-zone{
    min-height:auto !important;
    padding-top:clamp(1.45rem,4.2vw,2rem);
  }
  .hero__txt,
  .narr-zone .arc{
    margin-top:0 !important;
  }
  .bio{
    max-width:none;
    margin:0 0 clamp(.9rem,2.6vw,1.2rem);
  }
  .hero__txt{
    margin-top:clamp(1.25rem,3.8vw,1.7rem) !important;
  }
  .narr-zone .arc{
    margin-top:clamp(.9rem,3vw,1.3rem) !important;
  }
  .narr{
    position:static;
    order:9;
    opacity:1;
    pointer-events:auto;
    width:100%; max-width:100%; min-width:0;
    margin-top:clamp(.55rem,2.4vw,.85rem);
  }

  .mobile-arrow-axis{
    position:absolute;
    pointer-events:none;
    z-index:0;
    left:calc(var(--mobile-arrow-x) - .5px);
    top:calc(var(--mobile-arrow-top) - .5px);
    width:1px;
    height:0;
    background:var(--hair);
    max-height:var(--mobile-arrow-h);
    overflow:hidden;
    will-change:height;
  }

  .narr__svg{ display:none; }
  .narr__stats{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:clamp(.28rem,1.4vw,.42rem);
    padding-left:0;
    border-left:0;
  }
  .narr__stat{
    position:static;
    width:auto; max-width:none;
    display:grid;
    grid-template-columns:max-content minmax(0,1fr);
    align-items:baseline;
    column-gap:clamp(.32rem,1.4vw,.48rem);
    opacity:1;
    transform:none;
  }
  .home.mobile-arrow-ready .narr__stat{
    opacity:0;
    transform:translateY(4px);
  }
  .narr__n{
    position:relative;
    display:block;
    min-width:0;
    padding-left:var(--metric-shift);
  }
  .narr__n::before{
    content:"";
    position:absolute;
    pointer-events:none;
    left:0;
    top:calc(50% - .5px);
    width:calc(var(--metric-shift) - var(--branch-gap));
    height:1px;
    background:var(--hair);
    transform:scaleX(0);
    transform-origin:0 50%;
    will-change:transform;
  }
  .narr__l{
    min-width:0;
    font-size:clamp(.48rem,1.9vw,.52rem);
    line-height:1.34;
    white-space:nowrap;
  }
  .home.mobile-arrow-ready.mobile-arrow-on .narr__n::before{
    transform:scaleX(1);
    transition:transform 280ms var(--ease) var(--arrow-delay,0ms);
  }
  .home.mobile-arrow-ready.mobile-arrow-on .narr__stat{
    opacity:1;
    transform:none;
    transition:opacity 420ms var(--ease), transform 420ms var(--ease);
    transition-delay:var(--arrow-delay,0ms);
  }

  .arcade{
    position:relative;
    grid-template-columns:1fr;
    row-gap:clamp(1.05rem,3.6vw,1.45rem);
    margin-top:clamp(.95rem,3.4vw,1.35rem);
  }
  .arcade .mov{
    border-top:0;
    padding-top:0;
    padding-left:var(--body-gutter);
  }
  .arcade .mov::before{
    content:none !important;
    display:none !important;
  }
  .arcade .mov__n{
    display:none !important;
  }
  .arcade .mov__h{
    position:relative;
    z-index:1;
    padding-left:var(--title-shift);
    margin:.1rem 0 .65rem;
  }
  .arcade .mov__h::before{
    content:"";
    position:absolute;
    pointer-events:none;
    z-index:2;
    left:calc(var(--body-gutter) * -1);
    top:calc(50% - .5px);
    width:calc(var(--body-gutter) + var(--title-shift) - var(--branch-gap));
    height:1px;
    background:var(--hair);
    transform:scaleX(0);
    transform-origin:0 50%;
    will-change:transform;
  }

  .arcade > .mov:last-child .mov__h::after{
    content:"";
    position:absolute;
    pointer-events:none;
    z-index:1;
    left:calc(var(--body-gutter) * -1 - 1px);
    top:calc(50% + .5px);
    width:3px;
    height:calc(100dvh + 20rem);
    background:var(--paper);
  }

  .home.mobile-arrow-ready.mobile-arrow-on .arcade .mov__h::before{
    transform:scaleX(1);
    transition:transform 300ms var(--ease) var(--arrow-delay,0ms);
  }
}

@media (max-width:389px){
  .narr__l{ white-space:normal; }
}

@media (max-width:820px) and (prefers-reduced-motion:reduce){
  .mobile-arrow-axis,
  .narr__n::before,
  .arcade .mov__h::before{
    transform:none !important;
    transition:none !important;
  }
  .home.mobile-arrow-ready .narr__stat{
    opacity:1 !important;
    transform:none !important;
    transition:none !important;
  }
}
`;

  const JS = String.raw`
(() => {
  'use strict';

  const mq = matchMedia('(max-width:820px)');
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const home = document.querySelector('.view[data-view="home"] .home');
  if (!home) return;

  const arc = home.querySelector('.narr-zone .arc');
  const metricStats = [...home.querySelectorAll('.narr__stat')];
  const metricNumbers = metricStats.map(stat => stat.querySelector('.narr__n'));
  const titles = [...home.querySelectorAll('.arcade > .mov > .mov__h')];
  const lastTitle = titles[titles.length - 1];
  if (!arc || metricNumbers.length !== 5 || metricNumbers.some(n => !n) || titles.length !== 3 || !lastTitle) return;

  const DRAW = 1900;
  const HOLD = 120;
  const CONTINUE = 1900;

  const axis = document.createElement('span');
  axis.className = 'mobile-arrow-axis';
  axis.setAttribute('aria-hidden','true');
  home.appendChild(axis);

  let started = false;
  let axisAnimation = null;
  let axisDone = false;
  let timeline = null;

  function layoutBox(el){
    let x = 0, y = 0, node = el;
    while (node && node !== home){
      x += node.offsetLeft || 0;
      y += node.offsetTop || 0;
      node = node.offsetParent;
    }
    if (node === home){
      return {x, y, width:el.offsetWidth, height:el.offsetHeight};
    }
    const hr = home.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    return {x:r.left - hr.left, y:r.top - hr.top, width:r.width, height:r.height};
  }

  function measureArrow(){
    if (!mq.matches) return null;

    const ab = layoutBox(arc);
    const lb = layoutBox(lastTitle);
    if (!ab.width || !lb.width) return null;

    const x = ab.x;
    const top = ab.y + ab.height;
    const end = lb.y + lb.height / 2;
    const height = Math.max(1, end - top);

    home.style.setProperty('--mobile-arrow-x', x.toFixed(2) + 'px');
    home.style.setProperty('--mobile-arrow-top', top.toFixed(2) + 'px');
    home.style.setProperty('--mobile-arrow-h', height.toFixed(2) + 'px');

    const metricPoints = metricNumbers.map((node, i) => {
      const b = layoutBox(node);
      const y = b.y + b.height / 2;
      return {node, stat:metricStats[i], y};
    });

    const metricEnd = Math.max(top + 1, metricPoints[metricPoints.length - 1].y);
    const metricSpan = Math.max(1, metricEnd - top);
    const metricClock = DRAW + HOLD * metricPoints.length;
    const total = metricClock + CONTINUE;
    const frames = [{height:'0px', offset:0}];

    metricPoints.forEach((point, i) => {
      const q = Math.min(1, Math.max(0, (point.y - top) / metricSpan));
      const arrival = q * DRAW + i * HOLD;
      const h = Math.max(0, point.y - top).toFixed(2) + 'px';
      frames.push({height:h, offset:Math.min(1, arrival / total)});
      frames.push({height:h, offset:Math.min(1, (arrival + HOLD) / total)});
      const delay = Math.round(arrival) + 'ms';
      point.node.style.setProperty('--arrow-delay', delay);
      point.stat.style.setProperty('--arrow-delay', delay);
    });

    titles.forEach(node => {
      const b = layoutBox(node);
      const y = b.y + b.height / 2;
      const q = Math.min(1, Math.max(0, (y - metricEnd) / Math.max(1, end - metricEnd)));
      const arrival = metricClock + q * CONTINUE;
      node.style.setProperty('--arrow-delay', Math.round(arrival) + 'ms');
    });

    frames.push({height:metricSpan.toFixed(2) + 'px', offset:Math.min(1, metricClock / total)});
    frames.push({height:height.toFixed(2) + 'px', offset:1});
    timeline = {height, total, frames};

    if (reduce || axisDone) axis.style.height = height.toFixed(2) + 'px';
    return timeline;
  }

  function playArrow(){
    const data = measureArrow();
    if (!data) return;
    axisAnimation?.cancel();
    axis.style.height = '0px';
    axisAnimation = axis.animate(data.frames, {
      duration:data.total,
      easing:'linear',
      fill:'forwards'
    });
    axisAnimation.finished.then(() => {
      axisDone = true;
      const finalData = measureArrow() || data;
      axis.style.height = finalData.height.toFixed(2) + 'px';
      axisAnimation?.cancel();
      axisAnimation = null;
    }).catch(() => {});
  }

  function activate(){
    if (started) return;
    started = true;
    if (!mq.matches) return;
    measureArrow();
    home.classList.add('mobile-arrow-on');
    if (reduce){
      axisDone = true;
      axis.style.height = 'var(--mobile-arrow-h)';
    } else {
      playArrow();
    }
  }

  function sync(){
    if (!mq.matches) return;
    measureArrow();
    home.classList.add('mobile-arrow-ready');
    if (reduce){
      started = true;
      axisDone = true;
      axis.style.height = 'var(--mobile-arrow-h)';
      home.classList.add('mobile-arrow-on');
    } else if (started){
      home.classList.add('mobile-arrow-on');
      if (axisDone) axis.style.height = 'var(--mobile-arrow-h)';
    }
  }

  const EVENTS = ['scroll','wheel','pointerdown','pointermove','keydown','touchstart'];
  EVENTS.forEach(type => addEventListener(type, activate, {passive:true, once:true}));

  let measureRAF = 0;
  const scheduleMeasure = () => {
    if (measureRAF) cancelAnimationFrame(measureRAF);
    measureRAF = requestAnimationFrame(() => {
      measureRAF = requestAnimationFrame(() => {
        measureRAF = 0;
        const data = measureArrow();
        if (axisDone && data) axis.style.height = data.height.toFixed(2) + 'px';
      });
    });
  };

  mq.addEventListener?.('change', sync);
  addEventListener('resize', scheduleMeasure, {passive:true});
  addEventListener('orientationchange', scheduleMeasure, {passive:true});
  document.fonts?.ready.then(() => {
    requestAnimationFrame(() => requestAnimationFrame(sync));
  });

  if (typeof ResizeObserver === 'function'){
    const ro = new ResizeObserver(scheduleMeasure);
    ro.observe(home);
    ro.observe(arc);
    ro.observe(home.querySelector('.narr__stats'));
    ro.observe(home.querySelector('.arcade'));
    metricStats.forEach(el => ro.observe(el));
    titles.forEach(el => ro.observe(el));
  }

  requestAnimationFrame(() => requestAnimationFrame(sync));
})();
`;

  fetch('arco.html', {cache:'no-store'})
    .then(response => {
      if (!response.ok) throw new Error('arco.html: HTTP ' + response.status);
      return response.text();
    })
    .then(source => {
      source = source.replace('<title>Arco | Christian da Costa</title>', '<title>Arco — mobile arrow | Christian da Costa</title>');
      source = source.replace('</head>', '<meta name="robots" content="noindex,nofollow"><style id="mobile-arrow-variant">' + CSS + '</style></head>');
      source = source.replace('</body>', '<script id="mobile-arrow-variant-js">' + JS + '</scr' + 'ipt></body>');
      document.open();
      document.write(source);
      document.close();
    })
    .catch(error => {
      document.body.innerHTML = '<pre style="padding:24px;font:12px/1.5 monospace;white-space:pre-wrap">Falha ao carregar a variante mobile.\n' +
        String(error && error.message || error).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>';
    });
})();
</script>
</body>
</html>
