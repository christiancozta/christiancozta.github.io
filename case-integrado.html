<style>
/* ============================================================
   CASE-INTEGRADO · Shell curatorial
   Editorial minimalism. Scale recomposed for 100% zoom density
   approximating the previous 80% zoom perception.
   ============================================================ */

:root {
  --bg-sidebar: #181818;
  --bg-content: #ffffff;
  --text-sidebar: #8a8a8a;
  --text-sidebar-active: #ffffff;
  --text-sidebar-hover: #c8c8c8;
  --text-content: #1a1a1a;
  --text-muted: #6b6b6b;
  --text-faint: #9a9a9a;
  --border-subtle: #e8e8e8;
  --border-sidebar: #2a2a2a;
  --accent: #3a6ea5;
  --sidebar-width: 196px;
  --font-base: 13px;
  --font-sm: 11px;
  --font-xs: 10px;
  --leading-body: 1.55;
  --leading-tight: 1.25;
  --tracking-tight: -0.01em;
  --tracking-wide: 0.04em;
  --tracking-wider: 0.08em;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: var(--font-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size: var(--font-base);
  line-height: var(--leading-body);
  color: var(--text-content);
  background: var(--bg-content);
  overflow: hidden;
}

button { font-family: inherit; font-size: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ---------- Shell layout ---------- */
.shell { display: flex; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
.shell--collapsed .sidebar--desktop { transform: translateX(-100%); }

/* ---------- Sidebar (desktop) ---------- */
.sidebar--desktop {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: var(--sidebar-width); background: var(--bg-sidebar);
  display: flex; flex-direction: column; z-index: 100;
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  border-right: 1px solid var(--border-sidebar);
}
.sidebar--desktop.collapsed { transform: translateX(-100%); }

.sidebar-inner {
  flex: 1; display: flex; flex-direction: column;
  padding: 20px 0 16px; overflow-y: auto; overflow-x: hidden;
}

/* ---------- Brand ---------- */
.sidebar-brand {
  display: flex; align-items: baseline; gap: 6px;
  padding: 0 20px 20px; border-bottom: 1px solid var(--border-sidebar);
  margin-bottom: 16px;
}
.brand-mark { font-family: "Fraunces", Georgia, serif; font-size: 16px; font-weight: 500; color: var(--text-sidebar-active); letter-spacing: var(--tracking-tight); }
.brand-text { font-family: "Inter", sans-serif; font-size: var(--font-sm); font-weight: 400; color: var(--text-sidebar); letter-spacing: var(--tracking-wide); text-transform: uppercase; }

/* ---------- Nav ---------- */
.sidebar-nav { display: flex; flex-direction: column; padding: 0 12px; gap: 1px; }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 8px; border-radius: 3px; color: var(--text-sidebar);
  transition: color 160ms ease, background 160ms ease;
  text-align: left; width: 100%; position: relative;
}
.nav-item:hover { color: var(--text-sidebar-hover); background: rgba(255,255,255,0.04); }
.nav-item.active { color: var(--text-sidebar-active); }
.nav-item.active .nav-marker { background: var(--text-sidebar-active); }
.nav-label { font-size: var(--font-base); font-weight: 400; letter-spacing: var(--tracking-tight); }
.nav-marker { width: 4px; height: 4px; border-radius: 50%; background: var(--border-sidebar); transition: background 160ms ease; flex-shrink: 0; }
.nav-item:hover .nav-marker { background: var(--text-sidebar-hover); }

/* ---------- Sidebar footer ---------- */
.sidebar-footer {
  margin-top: auto; padding: 14px 20px 0;
  border-top: 1px solid var(--border-sidebar);
  display: flex; justify-content: space-between; align-items: center;
}
.footer-text { font-size: var(--font-xs); color: #5a5a5a; letter-spacing: var(--tracking-wide); text-transform: uppercase; }
.footer-year { font-family: "Fraunces", Georgia, serif; font-size: var(--font-xs); color: #5a5a5a; }

/* ---------- Collapse button ---------- */
.collapse-btn {
  position: absolute; bottom: 14px; right: 12px;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  color: #5a5a5a; border-radius: 3px; transition: color 160ms ease, background 160ms ease;
}
.collapse-btn:hover { color: var(--text-sidebar-hover); background: rgba(255,255,255,0.06); }

/* ---------- Proximity hover zone ---------- */
.shell--collapsed::before { content: ""; position: fixed; left: 0; top: 0; bottom: 0; width: 6px; z-index: 99; background: transparent; }

/* ---------- Content area ---------- */
.content {
  flex: 1; margin-left: var(--sidebar-width); background: var(--bg-content);
  overflow-y: auto; overflow-x: hidden;
  transition: margin-left 280ms cubic-bezier(0.4, 0, 0.2, 1); position: relative;
}
.shell--collapsed .content { margin-left: 0; }

/* ---------- Mobile menu button ---------- */
.mobile-menu-btn {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 50;
  width: 32px; height: 32px; align-items: center; justify-content: center;
  color: var(--text-content); background: var(--bg-content);
  border: 1px solid var(--border-subtle); border-radius: 4px;
}

/* ---------- Autoria view ---------- */
.autoria { max-width: 620px; margin: 0 auto; padding: 48px 32px 80px; }
.autoria-header { margin-bottom: 28px; }
.autoria-kicker { display: block; font-size: var(--font-xs); color: var(--text-faint); letter-spacing: var(--tracking-wider); text-transform: uppercase; margin-bottom: 10px; }
.autoria-title { font-family: "Fraunces", Georgia, serif; font-size: 28px; font-weight: 400; letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); color: var(--text-content); margin-bottom: 14px; }
.autoria-lede { font-size: 14px; line-height: 1.5; color: var(--text-muted); font-weight: 300; }
.autoria-body { margin-bottom: 32px; }
.autoria-body p { font-size: 13px; line-height: 1.6; color: var(--text-content); margin-bottom: 12px; font-weight: 400; }

/* ---------- Principles ---------- */
.autoria-principles { display: flex; gap: 28px; padding: 20px 0; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); margin-bottom: 32px; }
.principle { flex: 1; }
.principle-title { font-family: "Fraunces", Georgia, serif; font-size: 13px; font-weight: 500; color: var(--text-content); margin-bottom: 6px; letter-spacing: var(--tracking-tight); }
.principle-body { font-size: var(--font-sm); line-height: 1.5; color: var(--text-muted); font-weight: 300; }

/* ---------- Project references ---------- */
.section-heading { font-size: var(--font-xs); color: var(--text-faint); letter-spacing: var(--tracking-wider); text-transform: uppercase; margin-bottom: 14px; font-weight: 500; }
.project-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 28px; }
.project-ref { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); transition: padding-left 200ms ease; }
.project-ref:hover { padding-left: 6px; }
.project-ref-link { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.project-ref-label { font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 500; color: var(--text-content); letter-spacing: var(--tracking-tight); }
.project-ref-tagline { font-size: var(--font-sm); color: var(--text-muted); font-weight: 300; }
.project-ref-external { display: flex; align-items: center; justify-content: center; color: var(--text-faint); padding: 4px; border-radius: 3px; transition: color 160ms ease, background 160ms ease; }
.project-ref-external:hover { color: var(--text-content); background: var(--border-subtle); }

/* ---------- Concept trigger ---------- */
.concept-trigger { font-size: var(--font-sm); color: var(--text-muted); padding: 6px 0; border-bottom: 1px solid var(--text-faint); display: inline-block; transition: color 160ms ease, border-color 160ms ease; letter-spacing: var(--tracking-wide); }
.concept-trigger:hover { color: var(--text-content); border-color: var(--text-content); }

/* ---------- Concept dialog ---------- */
.concept-overlay { position: fixed; inset: 0; background: rgba(24,24,24,0.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 200ms ease; }
.concept-dialog { background: var(--bg-content); max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 32px; position: relative; animation: slideUp 280ms cubic-bezier(0.4,0,0.2,1); }
.concept-close { position: absolute; top: 16px; right: 16px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); border-radius: 3px; transition: color 160ms ease; }
.concept-close:hover { color: var(--text-content); }
.concept-title { font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 500; color: var(--text-content); margin-bottom: 16px; letter-spacing: var(--tracking-tight); }
.concept-para { font-size: 13px; line-height: 1.6; color: var(--text-muted); margin-bottom: 12px; font-weight: 400; }

/* ---------- Frame view ---------- */
.frame-view { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.frame-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-content); flex-shrink: 0; }
.frame-bar-left { display: flex; align-items: baseline; gap: 10px; }
.frame-bar-label { font-family: "Fraunces", Georgia, serif; font-size: 14px; font-weight: 500; color: var(--text-content); letter-spacing: var(--tracking-tight); }
.frame-bar-tagline { font-size: var(--font-sm); color: var(--text-faint); font-weight: 300; }
.frame-bar-external { display: flex; align-items: center; gap: 4px; font-size: var(--font-xs); color: var(--text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 4px 8px; border-radius: 3px; transition: color 160ms ease, background 160ms ease; }
.frame-bar-external:hover { color: var(--text-content); background: var(--border-subtle); }
.frame-stage { flex: 1; position: relative; background: var(--bg-content); overflow-y: auto; overflow-x: hidden; }

/* ---------- Project detail (inline) ---------- */
.project-detail { max-width: 560px; margin: 0 auto; padding: 48px 32px 80px; }
.project-detail-kicker { display: block; font-size: var(--font-xs); color: var(--text-faint); letter-spacing: var(--tracking-wider); text-transform: uppercase; margin-bottom: 10px; }
.project-detail-title { font-family: "Fraunces", Georgia, serif; font-size: 32px; font-weight: 400; letter-spacing: var(--tracking-tight); line-height: var(--leading-tight); color: var(--text-content); margin-bottom: 8px; }
.project-detail-tagline { font-size: 14px; line-height: 1.5; color: var(--text-muted); font-weight: 300; margin-bottom: 20px; }
.project-detail-blurb { font-size: 13px; line-height: 1.6; color: var(--text-content); font-weight: 400; margin-bottom: 28px; }
.project-detail-section-heading { font-size: var(--font-xs); color: var(--text-faint); letter-spacing: var(--tracking-wider); text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }
.project-detail-pillars { list-style: none; padding: 0; margin-bottom: 32px; }
.pillar-item { font-size: 13px; line-height: 1.6; color: var(--text-content); padding: 10px 0; border-bottom: 1px solid var(--border-subtle); position: relative; padding-left: 16px; }
.pillar-item::before { content: ""; position: absolute; left: 0; top: 17px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-faint); }
.project-detail-link { display: inline-flex; align-items: center; gap: 5px; font-size: var(--font-xs); color: var(--text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase; padding: 6px 0; border-bottom: 1px solid var(--text-faint); transition: color 160ms ease, border-color 160ms ease; }
.project-detail-link:hover { color: var(--text-content); border-color: var(--text-content); }

/* ---------- Mobile sidebar ---------- */
.sidebar-overlay { display: none; }
.sidebar--mobile { display: none; }
.sidebar-close-mobile { display: none; }

/* ---------- Animations ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ---------- Responsive: mobile ---------- */
@media (max-width: 899px) {
  .sidebar--desktop { display: none; }
  .content { margin-left: 0; }
  .mobile-menu-btn { display: flex; }
  .sidebar-overlay { display: block; position: fixed; inset: 0; background: rgba(24,24,24,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 280ms ease; }
  .sidebar-overlay.visible { opacity: 1; pointer-events: auto; }
  .sidebar--mobile { display: flex; position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: var(--bg-sidebar); z-index: 160; transform: translateX(-100%); transition: transform 280ms cubic-bezier(0.4,0,0.2,1); flex-direction: column; }
  .sidebar--mobile.open { transform: translateX(0); }
  .sidebar-close-mobile { display: flex; position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; align-items: center; justify-content: center; color: var(--text-sidebar); border-radius: 3px; }
  .sidebar-close-mobile:hover { color: var(--text-sidebar-hover); background: rgba(255,255,255,0.06); }
  .autoria { padding: 56px 20px 60px; }
  .autoria-principles { flex-direction: column; gap: 14px; }
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---------- Scrollbar ---------- */
.sidebar-inner::-webkit-scrollbar, .content::-webkit-scrollbar, .concept-dialog::-webkit-scrollbar { width: 4px; }
.sidebar-inner::-webkit-scrollbar-track, .content::-webkit-scrollbar-track, .concept-dialog::-webkit-scrollbar-track { background: transparent; }
.sidebar-inner::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.content::-webkit-scrollbar-thumb, .concept-dialog::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }
</style>
</head>
<body>

<div class="shell" id="shell">

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Mobile sidebar -->
  <aside class="sidebar sidebar--mobile" id="sidebar-mobile" aria-label="Navegação" aria-hidden="true">
    <div class="sidebar-inner">
      <button class="sidebar-close-mobile" id="sidebar-close-mobile" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="sidebar-brand">
        <span class="brand-mark">A.</span>
        <span class="brand-text">Autoria</span>

      </div>
    </div>
  </aside>

  <!-- Desktop sidebar -->
  <aside class="sidebar sidebar--desktop" id="sidebar-desktop" aria-label="Navegação">
    <div class="sidebar-inner">
      <div class="sidebar-brand">
        <span class="brand-mark">A.</span>
        <span class="brand-text">Autoria</span>
      </div>
      <nav class="sidebar-nav" id="nav-desktop"></nav>
      <div class="sidebar-footer">
        <span class="footer-text">Shell curatorial</span>
        <span class="footer-year">2025</span>
      </div>
    </div>
    <button class="collapse-btn" id="collapse-btn" aria-label="Recolher" title="Recolher">
      <svg id="collapse-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
      </svg>

  <!-- Content -->
  <main class="content" id="content">
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div id="view-root"></div>
  </main>

  <!-- Concept dialog -->
  <div id="concept-container"></div>

</div>

<script>
(function () {
  "use strict";

  /* ---------- Data ---------- */
  var projects = {
    echo: {
      key: "echo",
      label: "ECHO",
      tagline: "Sistema de escuta e ressonância.",
      url: "https://echo-atr-io.web.app/echo.html",
      blurb: "Um sistema de escuta e ressonância. Captura, interpreta e devolve — sem armazenar o que não precisa reter.",
      pillars: ["Escuta contínua", "Ressonância sem persistência", "Resposta como forma"]
    },
    atrio: {
      key: "atrio",
      label: "ATRIO",
      tagline: "Estrutura de mediação e trânsito.",
      url: "https://echo-atr-io.web.app/atrio.html",
      blurb: "Uma estrutura de mediação e trânsito. Conecta, distribui e organiza — sem se tornar o conteúdo que atravessa.",
      pillars: ["Mediação estrutural", "Trânsito sem retenção", "Conexão como arquitetura"]
    }
  };

  var navItems = [
    { key: "autoria", label: "Autoria" },
    { key: "echo", label: "ECHO" },
    { key: "atrio", label: "ATRIO" }
  ];

  var autoriaData = {
    kicker: "Shell autoral · 2025",
    title: "Autoria",
    lede: "Uma moldura permanente para dois projetos que se sustentam sozinhos. O shell interpreta o conjunto; ECHO e ATRIO demonstram, cada um em sua própria linguagem.",
    body: [
      "ECHO e ATRIO são obras independentes. Vivem em seus próprios arquivos, são publicados por conta própria e atualizados quando precisam — sem cópias internas, sem sincronização manual.",
      "O que esta página faz é conectar. Oferece um percurso de leitura, um contexto curatorial e um acesso imediato a cada projeto, sem competir com eles."
    ],
    principles: [
      { title: "Independência", body: "Cada projeto é publicado e atualizado por conta própria. O shell nunca armazena cópias." },
      { title: "Atualização automática", body: "Quando ECHO ou ATRIO mudam, o shell reflete a versão atual — sem intervenção." },
      { title: "Acesso direto", body: "Cada projeto abre em sua própria URL, dentro do shell ou em aba separada." }
    ],
    concept: {
      title: "Sobre o conceito de shell",
      paragraphs: [
        "Um shell não é conteúdo. É a estrutura que permite que o conteúdo exista em relação. Esta página não reproduz ECHO nem ATRIO; cria as condições para que ambos sejam lidos como partes de um mesmo pensamento.",
        "A coluna esquerda é estrutural, não decorativa. Pertence à obra tanto quanto os projetos que ela conecta. A área direita é espaço negativo: não compete, não comenta, apenas sustenta.",
        "Quando você navega para ECHO ou ATRIO, o shell permanece. A moldura não desaparece — ela se recolhe, abre espaço e continua acessível. É a permanência que dá sentido ao trânsito."
      ]
    }
  };

  var ui = {
    collapseLabel: "Recolher",
    expandLabel: "Expandir",
    openNewTab: "Abrir em nova aba",
    loading: "Carregando projeto…",
    loadErrorTitle: "Não foi possível carregar o projeto",
    loadErrorBody: "Verifique sua conexão ou abra o projeto diretamente em nova aba.",
    retry: "Tentar novamente",
    conceptLabel: "Ler conceito",
    closeLabel: "Fechar",
    mobileMenuLabel: "Abrir menu"
  };

  /* ---------- State ---------- */
  var PROXIMITY_THRESHOLD = 24;
  var collapsed = false;
  var proximityReveal = false;
  var mobileOpen = false;
  var conceptOpen = false;
  var proximityTimer = null;
  var currentRoute = "autoria";

  /* ---------- DOM refs ---------- */
  var shell = document.getElementById("shell");
  var navDesktop = document.getElementById("nav-desktop");
  var navMobile = document.getElementById("nav-mobile");
  var collapseBtn = document.getElementById("collapse-btn");
  var collapseIcon = document.getElementById("collapse-icon");
  var content = document.getElementById("content");
  var viewRoot = document.getElementById("view-root");
  var conceptContainer = document.getElementById("concept-container");
  var sidebarMobile = document.getElementById("sidebar-mobile");
  var sidebarOverlay = document.getElementById("sidebar-overlay");
  var sidebarCloseMobile = document.getElementById("sidebar-close-mobile");
  var mobileMenuBtn = document.getElementById("mobile-menu-btn");

  /* ---------- Routing ---------- */
  function parseHash() {
    var raw = window.location.hash.replace(/^#\/?/, "").toLowerCase();
    if (raw === "echo" || raw === "atrio" || raw === "autoria") return raw;
    return "autoria";
  }

  function navigate(key) {
    var target = "#/" + key;
    if (window.location.hash === target) return;
    window.location.hash = target;
  }

  function onRouteChange() {
    currentRoute = parseHash();
    updateTitle();
    renderNav();
    renderView();
    closeMobile();
  }

  function updateTitle() {
    var titles = {
      autoria: "Autoria — ECHO · ATRIO",
      echo: "ECHO — Autoria",
      atrio: "ATRIO — Autoria"
    };
    document.title = titles[currentRoute] || titles.autoria;
  }

  /* ---------- Nav rendering ---------- */
  function renderNav() {
    var html = "";
    for (var i = 0; i < navItems.length; i++) {
      var item = navItems[i];
      var isActive = item.key === currentRoute;
      var marker = item.key !== "autoria"
        ? '<span class="nav-marker" aria-hidden="true"></span>'
        : "";
      html += '<button class="nav-item ' + (isActive ? "active" : "") + '" data-key="' + item.key + '">' +
        '<span class="nav-label">' + item.label + "</span>" + marker + "</button>";
    }
    navDesktop.innerHTML = html;
    navMobile.innerHTML = html;

    var desktopBtns = navDesktop.querySelectorAll(".nav-item");
    var mobileBtns = navMobile.querySelectorAll(".nav-item");
    for (var d = 0; d < desktopBtns.length; d++) {
      desktopBtns[d].addEventListener("click", handleNavClick);
    }
    for (var m = 0; m < mobileBtns.length; m++) {
      mobileBtns[m].addEventListener("click", handleNavClick);
    }
  }

  function handleNavClick(e) {
    var key = e.currentTarget.getAttribute("data-key");
    navigate(key);
  }

  /* ---------- View rendering ---------- */
  function renderView() {
    if (currentRoute === "autoria") {
      renderAutoria();
    } else {
      renderFrame(projects[currentRoute]);
    }
  }

  function renderAutoria() {
    var principlesHtml = "";
    for (var i = 0; i < autoriaData.principles.length; i++) {
      var p = autoriaData.principles[i];
      principlesHtml += '<div class="principle"><h3 class="principle-title">' + p.title + "</h3><p class=\"principle-body\">" + p.body + "</p></div>";
    }

    var bodyHtml = "";
    for (var b = 0; b < autoriaData.body.length; b++) {
      bodyHtml += "<p>" + autoriaData.body[b] + "</p>";
    }

    var projectsHtml = "";
    var projKeys = Object.keys(projects);
    for (var j = 0; j < projKeys.length; j++) {
      var proj = projects[projKeys[j]];
      projectsHtml += '<article class="project-ref">' +
        '<button class="project-ref-link" data-key="' + proj.key + '">' +
        '<span class="project-ref-label">' + proj.label + "</span>" +
        '<span class="project-ref-tagline">' + proj.tagline + "</span>" +
        "</button>" +
        '<a href="' + proj.url + '" target="_blank" rel="noopener noreferrer" class="project-ref-external" aria-label="' + ui.openNewTab + ": " + proj.label + '">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>' +
        "</a></article>";
    }

    viewRoot.innerHTML =
      '<div class="autoria">' +
        '<header class="autoria-header">' +
          '<span class="autoria-kicker">' + autoriaData.kicker + "</span>" +
          '<h1 class="autoria-title">' + autoriaData.title + "</h1>" +
          '<p class="autoria-lede">' + autoriaData.lede + "</p>" +
        "</header>" +
        '<div class="autoria-body">' + bodyHtml + "</div>" +
        '<section class="autoria-principles">' + principlesHtml + "</section>" +
        '<section class="autoria-projects">' +
          '<h2 class="section-heading">Projetos</h2>' +
          '<div class="project-list">' + projectsHtml + "</div>" +
        "</section>" +
        '<button class="concept-trigger" id="concept-trigger">' + ui.conceptLabel + "</button>" +
      "</div>";

    var trigger = document.getElementById("concept-trigger");
    if (trigger) trigger.addEventListener("click", openConcept);

    var refLinks = viewRoot.querySelectorAll(".project-ref-link");
    for (var r = 0; r < refLinks.length; r++) {
      refLinks[r].addEventListener("click", function (e) {
        navigate(e.currentTarget.getAttribute("data-key"));
      });
    }
  }

  function renderFrame(project) {
    var externalIconSvg = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>';

    var pillarsHtml = "";
    for (var i = 0; i < project.pillars.length; i++) {
      pillarsHtml += '<li class="pillar-item">' + project.pillars[i] + "</li>";
    }

    viewRoot.innerHTML =
      '<div class="frame-view">' +
        '<div class="frame-bar">' +
          '<div class="frame-bar-left">' +
            '<span class="frame-bar-label">' + project.label + "</span>" +
            '<span class="frame-bar-tagline">' + project.tagline + "</span>" +
          "</div>" +
          '<a href="' + project.url + '" target="_blank" rel="noopener noreferrer" class="frame-bar-external">' +
            ui.openNewTab + externalIconSvg +
          "</a>" +
        "</div>" +
        '<div class="frame-stage">' +
          '<div class="project-detail">' +
            '<span class="project-detail-kicker">Projeto</span>' +
            '<h2 class="project-detail-title">' + project.label + "</h2>" +
            '<p class="project-detail-tagline">' + project.tagline + "</p>" +
            '<p class="project-detail-blurb">' + project.blurb + "</p>" +
            '<h3 class="project-detail-section-heading">Pilares</h3>' +
            '<ul class="project-detail-pillars">' + pillarsHtml + "</ul>" +
            '<a href="' + project.url + '" target="_blank" rel="noopener noreferrer" class="project-detail-link">' +
              ui.openNewTab + externalIconSvg +
            "</a>" +
          "</div>" +
        "</div>" +
      "</div>";
  }

  /* ---------- Concept dialog ---------- */
  function openConcept() {
    conceptOpen = true;
    var paragraphsHtml = "";
    for (var i = 0; i < autoriaData.concept.paragraphs.length; i++) {
      paragraphsHtml += '<p class="concept-para">' + autoriaData.concept.paragraphs[i] + "</p>";
    }
    conceptContainer.innerHTML =
      '<div class="concept-overlay" id="concept-overlay" role="dialog" aria-modal="true" aria-labelledby="concept-title">' +
        '<div class="concept-dialog" id="concept-dialog">' +
          '<button class="concept-close" id="concept-close" aria-label="' + ui.closeLabel + '">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
          "</button>" +
          '<div class="concept-content">' +
            '<h2 id="concept-title" class="concept-title">' + autoriaData.concept.title + "</h2>" +
            paragraphsHtml +
          "</div>" +
        "</div>" +
      "</div>";

    var overlay = document.getElementById("concept-overlay");
    var dialog = document.getElementById("concept-dialog");
    var closeBtn = document.getElementById("concept-close");

    document.body.style.overflow = "hidden";
    closeBtn.focus();

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeConcept();
    });
    closeBtn.addEventListener("click", closeConcept);
    document.addEventListener("keydown", conceptKeyHandler);
  }

  function conceptKeyHandler(e) {
    if (e.key === "Escape") closeConcept();
  }

  function closeConcept() {
    if (!conceptOpen) return;
    conceptOpen = false;
    conceptContainer.innerHTML = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", conceptKeyHandler);
  }

  /* ---------- Collapse / proximity ---------- */
  function toggleCollapse() {
    collapsed = !collapsed;
    applyCollapseState();
  }

  function applyCollapseState() {
    var showCollapsed = collapsed && !proximityReveal;
    if (showCollapsed) {
      shell.classList.add("shell--collapsed");
      collapseBtn.setAttribute("aria-label", ui.expandLabel);
      collapseBtn.setAttribute("title", ui.expandLabel);
      collapseIcon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>';
    } else {
      shell.classList.remove("shell--collapsed");
      collapseBtn.setAttribute("aria-label", ui.collapseLabel);
      collapseBtn.setAttribute("title", ui.collapseLabel);
      collapseIcon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>';
    }
  }

  function onMouseMove(e) {
    if (!collapsed) return;
    if (e.clientX <= PROXIMITY_THRESHOLD) {
      proximityReveal = true;
      applyCollapseState();
      if (proximityTimer) {
        clearTimeout(proximityTimer);
        proximityTimer = null;
      }
    }
  }

  function onSidebarMouseLeave() {
    if (!collapsed) return;
    if (proximityTimer) clearTimeout(proximityTimer);
    proximityTimer = setTimeout(function () {
      proximityReveal = false;
      applyCollapseState();
    }, 600);
  }

  /* ---------- Mobile ---------- */
  function openMobile() {
    mobileOpen = true;
    sidebarMobile.classList.add("open");
    sidebarMobile.setAttribute("aria-hidden", "false");
    sidebarOverlay.classList.add("visible");
  }

  function closeMobile() {
    mobileOpen = false;
    sidebarMobile.classList.remove("open");
    sidebarMobile.setAttribute("aria-hidden", "true");
    sidebarOverlay.classList.remove("visible");
  }

  /* ---------- Init ---------- */
  function init() {
    currentRoute = parseHash();
    updateTitle();
    renderNav();
    renderView();

    window.addEventListener("hashchange", onRouteChange);
    collapseBtn.addEventListener("click", toggleCollapse);
    window.addEventListener("mousemove", onMouseMove);
    var sidebarDesktop = document.getElementById("sidebar-desktop");
    sidebarDesktop.addEventListener("mouseleave", onSidebarMouseLeave);
    mobileMenuBtn.addEventListener("click", openMobile);
    sidebarCloseMobile.addEventListener("click", closeMobile);
    sidebarOverlay.addEventListener("click", closeMobile);

    window.addEventListener("resize", function () {
      if (window.innerWidth >= 900) closeMobile();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
