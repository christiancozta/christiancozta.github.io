<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DATA — Caixa de métricas</title>
  <link rel="stylesheet" href="files-drawer-prototype.css">
</head>
<body>
  <main class="scene" data-scene>
    <section class="archive" aria-label="Caixa de métricas">
      <div class="archive__back" aria-hidden="true"></div>

      <div class="archive__files">
        <button class="metric-file" type="button" data-key="corpus" style="--i:0;--tab:14px" aria-label="Abrir lastro da métrica 115.114">
          <span class="metric-file__tab">115.114</span>
        </button>
        <button class="metric-file" type="button" data-key="modelos" style="--i:1;--tab:112px" aria-label="Abrir lastro da métrica 2.758">
          <span class="metric-file__tab">2.758</span>
        </button>
        <button class="metric-file" type="button" data-key="mapeados" style="--i:2;--tab:30px" aria-label="Abrir lastro da métrica 1.192">
          <span class="metric-file__tab">1.192</span>
        </button>
        <button class="metric-file" type="button" data-key="votos" style="--i:3;--tab:126px" aria-label="Abrir lastro da métrica 899">
          <span class="metric-file__tab">899</span>
        </button>
        <button class="metric-file" type="button" data-key="produtividade" style="--i:4;--tab:52px" aria-label="Abrir lastro da métrica 60,4%">
          <span class="metric-file__tab">60,4%</span>
        </button>
        <button class="metric-file" type="button" data-key="diretrizes" style="--i:5;--tab:108px" aria-label="Abrir lastro da métrica 56%">
          <span class="metric-file__tab">56%</span>
        </button>
      </div>

      <div class="archive__side" aria-hidden="true"></div>
      <div class="archive__front" aria-hidden="true">
        <span class="archive__handle"></span>
      </div>
    </section>

    <section class="evidence" data-panel hidden aria-hidden="true" aria-live="polite">
      <button class="evidence__close" type="button" data-close-panel aria-label="Fechar ficha">×</button>

      <div class="extracted-file" aria-hidden="true">
        <span data-active-tab>115.114</span>
      </div>

      <div class="sheet-window">
        <article class="sheet">
          <header class="sheet__top">
            <span>ARCO / DATA</span>
            <span data-sheet="fileId">FILE 01</span>
          </header>

          <p class="sheet__kicker">DOCUMENTO DE EVIDÊNCIA</p>
          <h1 data-sheet="value">115.114</h1>
          <p class="sheet__title" data-sheet="metric">Julgados de base</p>

          <dl class="sheet__grid">
            <div><dt>FONTE</dt><dd data-sheet="source">Corpus CODA</dd></div>
            <div><dt>NUMERADOR</dt><dd data-sheet="numerator">115.114 julgados</dd></div>
            <div><dt>DENOMINADOR</dt><dd data-sheet="denominator">n/a — contagem absoluta</dd></div>
            <div><dt>PERÍODO</dt><dd data-sheet="period">base consolidada</dd></div>
            <div><dt>CÁLCULO</dt><dd data-sheet="calculation">contagem absoluta</dd></div>
            <div><dt>DOCUMENTO</dt><dd data-sheet="document">corpus_coda.jsonl</dd></div>
          </dl>

          <footer class="sheet__footer">
            <span>LASTRO / 01</span>
            <span>DATA</span>
          </footer>
        </article>
      </div>
    </section>
  </main>

  <script src="files-drawer-prototype.js"></script>
</body>
</html>
