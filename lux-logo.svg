<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="lux-title">
  <title id="lux-title">LUX</title>
  <!--
    LUX — symbol (rising sun on horizon)
    A black semicircle (the light source) rests flat on the terracotta base bar (the horizon).
    Grid unit = 40px. Sun radius = 160 (4u) · base bar height = 40 (1u) → 4:1.
    Diameter = base width = 320 (aligned). Clearspace = 100px on all sides (symmetric).
    Ink #101010 · Terracotta #A63A23
  -->
  <!-- Sun: upper semicircle, flat edge sitting on the bar -->
  <path d="M100 260 A160 160 0 0 1 420 260 Z" fill="#101010"/>
  <!-- Terracotta base bar (horizon) -->
  <rect x="100" y="260" width="320" height="40" fill="#A63A23"/>
</svg>
