<style>
:root{--amarelo:#FFC800;--barra:#181818;--tinta:#2C2C2C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0A0A09}

/* artboard fixo 1920x1080, escalado por transform para caber na janela */
#palco{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;
  transform:translate(-50%,-50%) scale(var(--k,1))}
#tela{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--amarelo)}

/* barra superior com o menu do ARCO */
.barra{position:absolute;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:48px;
  padding:0 40px;background:var(--barra);color:#F2EFE9}
.barra b{font:700 22px/1 'Schibsted Grotesk',system-ui,sans-serif;letter-spacing:-.035em}
.barra nav{display:flex;gap:32px;margin-left:auto}
.barra a{color:inherit;text-decoration:none;opacity:.62;font:500 12px/1 'Azeret Mono',monospace;
  letter-spacing:.14em;text-transform:uppercase}
.barra a[aria-current]{opacity:1;color:var(--amarelo)}

/* logotipo com a mesma sangria de echo.html (intencional): 113.1vw centrado, vaza 125.76px
   em cada lado; bottom -1.5dvh (-16.2px) faz as letras passarem da borda inferior e
   emendarem na seção seguinte, que é #181818 como o próprio logo.
   1440 u = 2171.52 px (fator 1.508); topo do "h" fica em y 561. */
#logo{position:absolute;left:-125.76px;bottom:-16.2px;width:2171.52px;margin:0;line-height:0}
#logo svg{display:block;width:100%;height:auto;overflow:visible}

/* bloco descritivo. padrão: haste do "h" (x 989.76px) até 1906.35px (o "o" sangra pela direita),
   acima do topo do "h" (561px).
   legibilidade: 15.5px/1.6, tracking .08em calibrado contra vãos largos do justificado; text-wrap:pretty evita órfã;
   as ondas morrem 28px antes da margem esquerda, nada passa por trás das letras. */
#texto{position:absolute;z-index:2;top:var(--top);left:var(--left);width:var(--w);max-width:var(--w);margin:0;
  font-family:'Azeret Mono',monospace;font-weight:400;font-size:var(--fs);letter-spacing:var(--ls);
  line-height:var(--lh);text-transform:uppercase;text-align:justify;text-wrap:pretty;color:var(--tinta);background:transparent}
#texto::selection{background:#181818;color:var(--amarelo)}

/* ondas: camada de desenho sob o texto, sem eventos de ponteiro */
#ondas{position:absolute;inset:0;width:1920px;height:1080px;z-index:1;pointer-events:none}

/* painel de ajustes (fora do artboard, não entra no PNG) */
#abrir{position:fixed;right:16px;bottom:16px;z-index:10;border:0;border-radius:999px;padding:8px 14px;
  background:#181818;color:#FFC800;font:500 11px/1 'Azeret Mono',monospace;letter-spacing:.1em;cursor:pointer}
#ajustes{position:fixed;right:16px;bottom:56px;z-index:10;width:310px;max-width:calc(100vw - 32px);padding:16px;border-radius:10px;
  background:rgba(24,24,24,.94);color:#F2EFE9;font:400 11px/1.3 'Azeret Mono',monospace;
  box-shadow:0 18px 50px rgba(0,0,0,.4)}
#ajustes[hidden]{display:none}
#ajustes p{margin:0 0 12px;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
#ajustes label{display:grid;grid-template-columns:100px 1fr 66px;align-items:center;gap:8px;margin:0 0 8px}
#ajustes input[type=range]{width:100%;accent-color:#FFC800}
#ajustes input[type=number]{width:66px;padding:3px 4px;border:1px solid #444;border-radius:4px;background:#0A0A09;color:inherit;font:inherit}
#ajustes .acoes{display:flex;gap:6px;margin-top:12px}
#ajustes button{flex:1;padding:8px 6px;border:1px solid #444;border-radius:6px;background:transparent;color:inherit;font:inherit;cursor:pointer}
#ajustes button.png{background:#FFC800;border-color:#FFC800;color:#181818;font-weight:500}
</style>
</head>

<button id="abrir" type="button" aria-controls="ajustes" aria-expanded="false">AJUSTES (T)</button>

  <p>Bloco de texto</p>
  <div id="campos"></div>
  <div class="acoes">
    <button type="button" id="copiar">Copiar CSS</button>
    <button type="button" id="zerar">Padrão</button>
    <button type="button" id="png" class="png">PNG 1920</button>

</form>

<script>
// escala responsiva
const palco = document.getElementById('palco');
const encaixar = () => palco.style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080));
addEventListener('resize', encaixar); encaixar();

// ajustes: [chave, rótulo, min, max, passo, padrão, unidade]
const CAMPOS = [
  ['top',  'top',            60, 1000, 1,     292,    'px'],
  // left = haste do "h" com a sangria (739.73 u × 1.508 − 125.76); direita mantida em 1906.35 (o "o" agora sai da tela)
  ['left', 'left',            0, 1900, 0.5,   989.76, 'px'],
  ['w',    'max-width',     100, 1920, 0.5,   916.59, 'px'],
  // 15.5px + .08em: com esta largura e este texto, o maior vão do justificado fica em 1,12× o espaço normal
  ['fs',   'font-size',       8,   40, 0.5,   15.5,   'px'],
  ['ls',   'letter-spacing', -0.05, 0.4, 0.005, 0.08, 'em'],
  ['lh',   'line-height',   0.8,  3, 0.05,  1.6,    ''],
];
const texto = document.getElementById('texto');
const caixa = document.getElementById('campos');
const CHAVE = 'echo-ajustes-v2';
let salvo = {};
try { salvo = JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) {}
const valores = {};
// grava só o que o usuário mexeu; padrões novos do código continuam valendo
const gravar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(valores)); } catch (e) {} };

const aplicar = (k, v) => {
  const c = CAMPOS.find(c => c[0] === k);
  valores[k] = +v;
  texto.style.setProperty('--' + k, v + c[6]);
  caixa.querySelectorAll('[data-k="' + k + '"]').forEach(i => { if (i !== document.activeElement) i.value = v; });
};

for (const [k, rot, min, max, passo, padrao] of CAMPOS) {
  const l = document.createElement('label');
  l.innerHTML = `<span>${rot}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${passo}"><input type="number" data-k="${k}" min="${min}" max="${max}" step="${passo}">`;
  caixa.append(l);
  aplicar(k, salvo[k] ?? padrao);
}
caixa.addEventListener('input', e => { if (e.target.value !== '') { aplicar(e.target.dataset.k, e.target.value); gravar(); } });

document.getElementById('zerar').onclick = () => {
  CAMPOS.forEach(c => aplicar(c[0], c[5]));
  try { localStorage.removeItem(CHAVE); } catch (e) {}
  if (calmo.matches) desenhar(0);
};

// ondas: mesma linguagem das meias-luas vazadas do "o" (arcos de elipse, grossos no centro e
// finos nas pontas), mas viradas para o lado oposto ao do "o": a frente ")" avança com o centro
// na dianteira, vinda do abstrato (esquerda) até o bloco, que é o ponto final que recebe os ecos.
// O "o" mantém seu lado "(": é o que ecoou depois, a metodologia transmitida ao final
// ("Rodou por outros 30 dias. Mas ecoou: foi transmitido ao gabinete que nos sucedeu.").
// A parede fica 28px antes do texto e é o que importa: o centro bate primeiro, a frente achata
// reta contra ela, e o impacto corre até as pontas, acendendo e desfazendo cada trecho em pó.
// Variação com regra: cada emissão é um trem de eco (a frente e 1 ou 2 réplicas mais fracas,
// a distâncias fixas, na mesma velocidade). A irregularidade mora só no intervalo entre trens
// e numa oscilação leve de velocidade; a forma das meias-luas é constante, como no "o".
// Na parede o trem bate em cascata: frente, réplica, réplica.
// Lidas do DOM a cada quadro, seguem os ajustes do painel.
const cv = document.getElementById('ondas'), cx = cv.getContext('2d');
const calmo = matchMedia('(prefers-reduced-motion: reduce)');
const MEDIA = 2.1;   // s entre trens, em média; cada saída se desloca até ±0,35 intervalo (1,4 s a 2,8 s entre vizinhos)
const VEL = 78;      // px/s médio; cada trem vai de 0,88× a 1,12× disso e oscila ±12% no caminho
const ALTURA = 300;  // altura da frente, px (±8% por trem)
const CURVA = 66;    // profundidade da meia-lua, px (±10% por trem)
const ECOS = [[0, 1], [26, .5], [50, .24]]; // [px atrás da frente, intensidade relativa]
const CAMPO = 308;   // centro vertical do campo livre entre barra (56) e topo do "h" (561)
const PEDACOS = 28;  // fragmentos de cada frente
const liso = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
const ruido = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }; // variação estável por trem
let res = 1;
const dimensionar = () => {
  res = Math.min(2, Math.max(1, (+palco.style.getPropertyValue('--k') || 1) * devicePixelRatio));
  cv.width = 1920 * res; cv.height = 1080 * res;
};

// parâmetros fixos de cada trem n (o mesmo n gera sempre o mesmo trem)
const trem = n => ({
  t0: (n + (ruido(n + 19) - .5) * .7) * MEDIA,
  v: VEL * (.88 + .24 * ruido(n + 11)),
  w: .8 + .6 * ruido(n + 23),                  // ritmo da oscilação de velocidade, rad/s
  f: ruido(n + 29) * 6.283,
  curva: CURVA * (.9 + .2 * ruido(n + 31)),
  h: ALTURA * (.92 + .16 * ruido(n)),
  dy: (ruido(n + 7) - .5) * 80,                // altura de origem
  ecos: ruido(n + 41) < .45 ? 2 : 3,           // às vezes só uma réplica
});

function desenhar(t) {
  const parede = texto.offsetLeft - 28, alt = texto.offsetHeight, yAlvo = texto.offsetTop + alt / 2;
  cx.setTransform(res, 0, 0, res, 0, 0);
  cx.clearRect(0, 0, 1920, 1080);
  if (parede < 240) return;
  const vida = (parede + CURVA * 1.1 + 110) / (VEL * .88 * .88); // travessia do trem mais lento
  cx.lineCap = 'butt';
  for (let n = Math.floor((t - vida) / MEDIA) - 1; n <= Math.floor(t / MEDIA) + 1; n++) {
    const T = trem(n), tau = t - T.t0;
    if (tau < 0) continue;
    // velocidade v·(1 + .12·cos): sempre para a frente; p = centro da frente líder, p(0) = 0
    const k = .12 * T.v / T.w;
    const lider = T.v * tau + k * (Math.sin(T.w * tau + T.f) - Math.sin(T.f));
    for (let e = 0; e < T.ecos; e++) {
      const [atras, forca] = ECOS[e];
      const p = lider - atras;
      if (p <= 0 || p > parede + T.curva + 60) continue;
      const conv = liso(0, 1, p / parede);    // 0 na origem, 1 na parede
      const yc = CAMPO + T.dy * (1 - conv) + (yAlvo - CAMPO) * conv;
      const base = .22 * forca * liso(0, 220, p);
      if (base < .004) continue;
      const arco = s => p - T.curva * (1 - Math.sqrt(Math.max(0, 1 - s * s))); // ")": centro na dianteira
      for (let j = 0; j < PEDACOS; j++) {
        const meio = (j + .5) / PEDACOS * 2 - 1;
        // choque local: quanto este trecho já "passaria" da parede. O centro bate primeiro
        // e o impacto corre pela parede até as pontas; cada trecho acende, incha e vira pó.
        const choque = liso(parede, parede + 50, arco(meio));
        const alfa = base * (1 - choque) ** 1.4 * (1 + 2.6 * Math.sin(Math.PI * Math.min(1, choque * 2.5)));
        if (alfa < .004) continue;
        const meia = (1 - .92 * choque) / PEDACOS;
        cx.strokeStyle = `rgba(44,44,44,${Math.min(alfa, .6)})`;
        cx.lineWidth = (.45 + 1.55 * Math.sqrt(1 - meio * meio)) * (1 + choque); // meia-lua: grossa no centro
        cx.beginPath();
        for (let q = 0; q <= 3; q++) {
          const s = meio - meia + 2 * meia * q / 3;
          const x = Math.min(arco(s), parede); // o que passaria da parede fica reto contra ela
          const y = yc + s * T.h / 2;
          q ? cx.lineTo(x, y) : cx.moveTo(x, y);
        }
        cx.stroke();
      }
    }
  }
}

// rAF já pausa com a aba oculta; com movimento reduzido fica um quadro fixo
let quadro;
const rodar = ms => { desenhar(ms / 1000); quadro = requestAnimationFrame(rodar); };
const iniciar = () => { cancelAnimationFrame(quadro); calmo.matches ? desenhar(0) : (quadro = requestAnimationFrame(rodar)); };
addEventListener('resize', () => { dimensionar(); if (calmo.matches) desenhar(0); });
caixa.addEventListener('input', () => { if (calmo.matches) desenhar(0); });
calmo.addEventListener('change', iniciar);
document.fonts.ready.then(() => { dimensionar(); iniciar(); });
document.getElementById('copiar').onclick = () => {
  const css = `#texto{top:${valores.top}px;left:${valores.left}px;max-width:${valores.w}px;font-size:${valores.fs}px;letter-spacing:${valores.ls}em;line-height:${valores.lh}}`;
  navigator.clipboard?.writeText(css).catch(() => {});
  prompt('CSS do bloco:', css);
};

// painel: botão ou tecla T
const painel = document.getElementById('ajustes'), abrir = document.getElementById('abrir');
const alternar = () => { painel.hidden = !painel.hidden; abrir.setAttribute('aria-expanded', !painel.hidden); };
abrir.onclick = alternar;
addEventListener('keydown', e => { if (e.key.toLowerCase() === 't' && !/INPUT|TEXTAREA/.test(e.target.tagName)) alternar(); });

// exportação PNG 1920x1080: renderiza o artboard sem a escala de tela
document.getElementById('png').onclick = async () => {
  await document.fonts.ready;
  desenhar(calmo.matches ? 0 : performance.now() / 1000); // garante quadro mesmo com rAF suspenso
  const canvas = await html2canvas(document.getElementById('tela'), {
    width: 1920, height: 1080, scale: 1, backgroundColor: '#FFC800', logging: false,
    onclone: d => {
      Object.assign(d.getElementById('palco').style, { transform: 'none', left: '0', top: '0' });
      // html2canvas não copia o bitmap do canvas; leva o quadro atual das ondas para o clone
      const c2 = d.getElementById('ondas');
      c2.width = cv.width; c2.height = cv.height;
      c2.getContext('2d').drawImage(cv, 0, 0);
    }
  });
  const a = document.createElement('a');
  a.download = 'echo-1920x1080.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};
</script>
